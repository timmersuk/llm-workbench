approach: >-
  Port logthing's Dockerfile and .github/workflows/ci.yml wholesale,
  trimming the second (syslogsend) binary and adjusting names/paths for
  llm-workbench, rather than designing CI/Docker packaging from scratch.

steps:
  - "Add a multi-arch cross-compile target to the Makefile, mirroring logthing's build-go-local OS/ARCH loop — the current build-go-local only builds for the host GOOS/GOARCH."
  - "Add Dockerfile at the repo root, adapted from logthing's: debian:bookworm-slim base, non-root user, COPY --chown of bin/${TARGETPLATFORM}/workbench, ENV defaults, EXPOSE, ENTRYPOINT — dropping the syslogsend COPY and its ports."
  - "Add .github/workflows/ci.yml with a test job (checkout, setup-go, setup-node, corepack pnpm, install+build frontend, go test ./...) and a docker job (needs: test — QEMU/buildx setup, CI_BUILD_ID derivation, docker/metadata-action, conditional docker/login-action + push, docker/build-push-action for linux/amd64+arm64)."
  - "Resolve the registry choice (Docker Hub vs GHCR) and whether a persistent-volume/compose story is needed for WORKSPACE_ROOT before implementation starts."
  - "Once implemented, record the 'copy CI/Docker pattern from sibling repos' convention in docs/engineering conventions.md."

risks:
  - "No persistent-volume story yet for WORKSPACE_ROOT (this repo's analogue of logthing's /data volume + DATA_DIR) — needs a decision before the Dockerfile/compose design is final."
  - "No existing multi-arch build target in the Makefile — build-go-local only covers the host GOOS/GOARCH today."
  - "Registry/credentials (Docker Hub secrets vs GHCR) not yet provisioned for this repo."

estimated_complexity: medium
recommended_executor: ""
