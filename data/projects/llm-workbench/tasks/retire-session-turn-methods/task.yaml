id: retire-session-turn-methods
title: Retire the dead StreamSessionTurn/SeedSessionHistory session methods
project: llm-workbench

status: complete

stage: merged

created_at: 2026-07-11T00:00:00Z
updated_at: 2026-07-12T00:00:00Z

objective: >-
  Remove chat.ChatClient.StreamSessionTurn and SeedSessionHistory, dead since
  PR 2 (2026-07-11): once ChatClientRunner.Run began driving internal/toolloop
  directly and owning its own per-SessionKey history, the client-held session
  machinery had no live caller. The methods were deliberately left in place
  through PR 3 to keep that PR's diff focused on Execute, then retired as a
  fold-in to the Bash PR. Delivered by PR #20 (commit fda9bfe).

constraints:
  - "Remove the two methods from the ChatClient interface and from both implementations (openAIClient, openaiSDKClient), plus the now-dead per-session `sessions` map and mutex they were the only users of."
  - "Remove the interface-satisfaction forwarders that only existed to satisfy the interface (cmd/server/main.go's defaultModelCompleter), not just the concrete implementations."
  - "Keep CloseSession on the interface as a no-op lifecycle hook: it is still called defensively by ChatClientRunner.CloseSession and remains a legitimate seam for a future stateful provider."
  - "No behaviour change: Run and Execute already bypass these methods, so removal must leave all existing runner/API behaviour intact."

assumptions:
  - "The 'dead code' was slightly deeper than the milestone follow-up note implied — forwarders lived in cmd/server/main.go as well as the two chat implementations; the compiler surfaced the full caller set once the interface methods were removed."
  - "toOpenAISDKMessages stays: the tool-loop engine still emits assistant-with-tool-calls and tool-role messages, so only its comment referencing StreamSessionTurn needed updating."

success_criteria:
  - "StreamSessionTurn and SeedSessionHistory removed from the interface, both client implementations, and the sessions map/mutex — MET (internal/chat/client.go, internal/chat/client_openai_sdk.go)."
  - "defaultModelCompleter forwarders removed and the whole repo builds/vets — MET (cmd/server/main.go)."
  - "The dead unit tests for these methods are removed and the retained CloseSession no-op is still covered; full repo test suite green — MET."

