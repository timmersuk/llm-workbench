summary: >-
  Package the existing single-binary server (cmd/server) as an installable
  Windows Service, using github.com/kardianos/service rather than hand-
  rolling golang.org/x/sys/windows/svc, so that the same code path can
  later gain macOS (launchd) and Linux (systemd) support as packaging work
  rather than a rewrite.

background: >-
  Surfaced 2026-07-07 in the same architectural-pivot assessment as
  graceful-shutdown: the claude-code executor spawns the claude CLI as a
  local subprocess with direct filesystem access to AGENT_REPOS_ROOT — a
  hard constraint (no SSH/RPC dispatch layer exists in
  internal/agentrunner) that rules out a small shared/remote server
  deployment. That points toward running this on the same machine the CLIs
  live on, as a proper background service left running rather than a
  process launched by hand each session. Confirmed via web search
  (2026-07-07) that kardianos/service is actively maintained and packaged
  (Debian/Fedora) as of 2026, and wraps Windows Service, launchd, and
  systemd/upstart/sysv behind one service.Interface/service.Control API.

files:
  - path: cmd/server/main.go
    role: >-
      add a service.Interface implementation (program type: Start launches
      graceful-shutdown's run(ctx) in a goroutine, Stop cancels that context
      and waits bounded for it to return) and a control code path
      (install/uninstall/start/stop/run) following kardianos/service's own
      example pattern; plain invocation (no arg) preserves today's
      console-mode behaviour exactly
  - path: go.mod
    role: >-
      add github.com/kardianos/service as a direct dependency;
      golang.org/x/sys is already present as an indirect dependency
      (go.mod:16) since the library is backed by x/sys/windows/svc on
      Windows — no CGO introduced
  - path: Makefile
    role: >-
      add an install-service/uninstall-service convenience target, or
      document the workbench.exe install invocation directly; no change
      needed to build-go-local (Makefile:17-19) itself, since the same
      binary serves both console and service modes
  - path: docs/engineering conventions.md
    role: >-
      document the new service mode under "Build & single-binary
      packaging", and the environment-variable-under-service-context
      caveat below, per this repo's convention of recording such decisions
      there

detail: |
  kardianos/service was chosen over hand-rolling x/sys/windows/svc directly
  because the Windows-only work done now would otherwise need
  re-architecting once macOS/Linux support is picked up — the library
  already abstracts install/uninstall/start/stop and the platform-specific
  service-manager integration behind one interface, so adding macOS/Linux
  later becomes primarily a packaging and testing exercise.

  The one real gap versus today's "run from a terminal" model: a Windows
  Service does not inherit a logged-in user's shell environment, so
  HTTP_ADDR/WORKSPACE_ROOT/AGENT_REPOS_ROOT/LLM_* vars (all currently read
  via plain os.Getenv-backed GetEnvDefault/MustGetEnv in main.go) need to
  be set via the service's own environment configuration (kardianos's
  Config.Option / the registry Environment value it writes) rather than
  assumed present. This should be documented explicitly at install time,
  not discovered as a startup failure after installing.

  Because AGENT_REPOS_ROOT is a hard MustGetEnv requirement (main.go:43),
  a service installed without it configured will fail to start entirely —
  worth surfacing a clear error in the service's event log rather than
  just a silent MustGetEnv-triggered Fatal, since a service's stderr isn't
  as visible as a console's.

verification:
  - "workbench.exe install registers a Windows Service; starting it via services.msc or sc start makes GET /healthcheck respond."
  - "sc stop performs a clean shutdown (same orphaned-subprocess check as graceful-shutdown) within the SCM's default stop timeout."
  - "workbench.exe uninstall removes the service cleanly, confirmed via services.msc no longer listing it."
  - "A service installed without AGENT_REPOS_ROOT configured produces a clear, discoverable error (event log or equivalent), not just a silent failure to start."

open_questions:
  - "How should required env vars actually be supplied to the installed service — via kardianos's own Config mechanism, a wrapper .env file read at run() entry, or documented manual registry/services.msc configuration? Needs a decision before implementation, since it changes the install UX."
  - "Should the fixed :8080 HTTP_ADDR default become a dynamically-chosen free port for service mode, to avoid conflicts on a shared machine? Affects windows-systray-icon too, which needs to know the resolved port."
