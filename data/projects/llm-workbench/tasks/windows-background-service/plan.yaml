approach: >-
  Adopt github.com/kardianos/service as a thin OS-abstraction layer over
  Windows Service/launchd/systemd, wrap graceful-shutdown's run(ctx) in a
  service.Interface implementation, and add install/uninstall/start/stop
  control to the existing cmd/server binary rather than building a separate
  service wrapper binary.

steps:
  - "Add github.com/kardianos/service to go.mod."
  - "Implement a program type satisfying service.Interface: Start launches run(ctx) (from graceful-shutdown) in a goroutine and returns immediately (required by the library); Stop cancels that context and waits, bounded, for run(ctx) to return."
  - "Add a control code path to cmd/server/main.go (leading CLI arg or flag: install/uninstall/start/stop/run), with plain invocation preserving today's console-mode behaviour exactly."
  - "Decide and document how required env vars (AGENT_REPOS_ROOT etc.) reach the installed service, since services don't inherit a user's shell environment."
  - "Add an install-service/uninstall-service Makefile target or documented invocation."
  - "Update docs/engineering conventions.md's Build & single-binary packaging section with the new service mode and the environment-configuration caveat."

risks:
  - "AGENT_REPOS_ROOT and other required env vars won't be present under a Windows Service's default environment — needs a resolved configuration story before this is usable, not just before it's documented."
  - "A service has no desktop interaction session by default, which constrains what windows-systray-icon can assume about supervising vs. owning this service — that decision should happen before, or alongside, this task's implementation."
  - "kardianos/service's exact behaviour on Windows service-stop timeouts vs. this repo's SHUTDOWN_TIMEOUT needs verifying empirically — the SCM has its own stop-timeout expectations independent of the app's internal one."

estimated_complexity: medium
recommended_executor: ""
