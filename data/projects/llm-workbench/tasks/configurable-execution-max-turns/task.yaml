id: configurable-execution-max-turns
title: Make Execute's (and, if still needed, Review's) max-turns cap configurable per task, ideally auto-derived at planning time
project: llm-workbench
status: draft
stage: requirements
created_at: 2026-07-24T00:00:00Z
updated_at: 2026-07-27T00:00:00Z
objective: >-
  Execute's turn budget is a single hardcoded constant —
  claudeExecutionMaxTurns in internal/agentrunner/claude_runner.go, shared by
  both the direct claude-code client (claude_runner.go) and the
  ChatClientRunner path (chat_client_runner.go) — so every task, regardless of
  its actual scope, gets the same cap. structured-ask-question-tool's exec-002
  hit this directly: a substantial plan (new tool schema, backend wiring,
  frontend rendering, tests across three files) exhausted the then-100-turn
  cap and failed outright with no partial credit path other than a full
  re-run. That constant has been bumped to 1000 as an immediate mitigation,
  but a single global number is still a blunt instrument: too low for large
  plans, needlessly high (and slower to fail) for small ones. This task scopes
  making the cap configurable per task — at minimum a field the plan or task
  can set, and ideally a value the system estimates at plan-finalize time from
  the plan's own shape (step count, file count touched), the same "derive a
  default at plan-finalize, let a human override it" pattern
  automated-executor-suggestion already scopes for executor/model choice.


  Update 2026-07-27: Review hit the identical failure (git-backed-storage's
  review conversation exhausted a 30-turn cap mid automated-checks/live-
  smoke-testing). Root cause and immediate fix already landed this session,
  separately from this task's remaining scope — see "What's already done"
  below. What's left for Review is the same configurability gap Execute still
  has: no per-task override, no auto-derivation. This task's scope is
  broadened to cover both turn budgets (Execute's and Review's) with one
  mechanism rather than solving the same problem twice.
constraints:
  - "Human override always available: whatever default is computed or configured, a human must be able to see and change it before or during Execute/Review — no silent, unreviewable cap (docs/architectural invariants.md, 'humans own intent')."
  - "No hidden state: the effective max-turns value for a given execution/review must be inspectable (e.g. recorded on the Execution or Plan record), not buried in a runtime default the human can't see (docs/architectural invariants.md)."
  - "Applies to both agentrunner paths that currently read claudeExecutionMaxTurns (claude_runner.go's direct client and chat_client_runner.go's ChatClientRunner) for Execute — a fix scoped to only one would leave the other still hardcoded."
  - "No new runtime dependency without a stated reason (project architectural invariant)."
  - "Never let a runner infer its turn budget from an unrelated signal (e.g. a tool-enablement flag) — that was rejected mid-session as fragile, silently-coupled behavior. The turn budget must always be an explicit value the caller computes and passes in (agentrunner.RunInput.MaxTurns / a future ExecuteInput.MaxTurns), never something a runner guesses from other input fields."
  - "Whatever mechanism is chosen must be executor-agnostic in shape, not Claude-specific: ClaudeRunner and ChatClientRunner (local LLM) already share the exact same turn-budget bug class (both read the same constant today), and CodexRunner is a third AgentRunner implementation with no turn-cap mechanism at all (codex-agent-sdk-go bounds runs by wall-clock timeout only, no exposed turn count) — the design should account for that asymmetry explicitly (e.g. decide whether Codex needs a turn-cap mechanism added, or is deliberately left timeout-only) rather than silently assuming every executor works like ClaudeRunner."
assumptions:
  - "Related seam, not a duplicate: automated-executor-suggestion (draft) already scopes 'derive a default at plan-finalize time, human can override' for executor/model selection. This task is the same pattern applied to a different knob (turn budget) — worth building on the same mechanism/UI if that task lands first, but each can also ship independently."
  - "Open question: does the configured/derived value live on plan.yaml (alongside the existing recommended_executor seam) or on task.yaml — plan.yaml seems the better fit for Execute since it's plan shape (step/file count) that would drive an estimate; Review has no plan.yaml-equivalent shape signal, so a task.yaml field (or a small preset) is more likely the right fit there. Worth deciding whether Execute and Review share one field or get two."
  - "Open question: what estimate signal is actually predictive — plan.steps count, referenced file count, task.constraints complexity — versus just letting a human pick from a small set of presets (e.g. small/medium/large). Start minimal; do not build a scoring model before a real failure pattern (beyond this one incident) justifies it."
  - "Immediate mitigation already applied: claudeExecutionMaxTurns bumped from 100 to 1000 as a stopgap (internal/agentrunner/claude_runner.go) — this task is about making the cap configurable, not about re-tuning the single global default further."
  - "What's already done (2026-07-27, this session, ahead of this task): agentrunner.RunInput gained an explicit MaxTurns field, set by the caller only — internal/api/stage_conversation.go's resolveStageRun now picks requirementsPlanningMaxTurns (30) or reviewMaxTurns (1000) per stage and threads it through every RunInput{} construction; ClaudeRunner.clientFor only emits claudecode.WithMaxTurns when MaxTurns > 0 (omitting it lets the CLI run unbounded); toolloop.Engine.Run's turn loop now treats MaxTurns <= 0 as 'no limit' instead of 'zero turns'; no runner falls back to a hardcoded per-executor constant when MaxTurns is left at zero — zero always means unlimited (bounded only by the runner's own call timeout), never a substituted default. This closes Review's immediate failure and establishes the explicit-value convention this task's remaining work (Execute + real per-task configurability + Codex's asymmetry) should reuse rather than re-litigate."
success_criteria:
  - "A documented decision on the surfacing point (plan.yaml field vs. task.yaml field vs. Execute/Review-trigger UI default) and, if auto-derivation is in scope, what plan-shape signal feeds it."
  - "If built, the effective max-turns value for a given Execute or Review run is inspectable on the resulting Execution/Review record, and a human can override whatever default was computed or configured."
  - "Both agentrunner call sites that currently hardcode claudeExecutionMaxTurns read the configured/derived value instead, following the same explicit-caller-supplied-value convention already established for Run's MaxTurns (no runner-side fallback constant)."
  - "A recorded decision on whether CodexRunner gains an equivalent turn-cap mechanism, or is deliberately left timeout-only — not silently left inconsistent with the other two runners."
