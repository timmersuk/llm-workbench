approach: >-
  Build a new cmd/tray binary on fyne.io/systray with a minimal three-item
  menu (status, open-in-browser, quit), after first resolving whether it
  owns the server process directly or supervises an already-installed
  Windows Service.

steps:
  - "Resolve the own-vs-supervise design question (see context.yaml) before writing code, since it determines cmd/tray's structure."
  - "Add fyne.io/systray to go.mod; scaffold cmd/tray/main.go with icon + menu skeleton."
  - "Wire the status menu item to poll GET /healthcheck on an interval and reflect healthy/unhealthy."
  - "Wire \"Open in browser\" to the resolved host:port."
  - "Wire \"Quit\" to the graceful-shutdown path (direct run(ctx) cancellation if owning the process, or an SCM stop call if supervising windows-background-service), then exit the tray process and remove the icon."
  - "Resolve how the tray learns the server's actual port if it isn't the fixed :8080 default."

risks:
  - "The own-vs-supervise decision is a real fork in implementation, not a detail — starting to code before it's settled risks throwaway work."
  - "fyne.io/systray's Windows behaviour under less-common setups (multiple monitors, notification area overflow) is unverified for this repo's specific use case."

estimated_complexity: medium
recommended_executor: ""
