id: windows-systray-icon
title: Add a Windows systray icon for status and control
project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-07T00:00:00Z
updated_at: 2026-07-07T00:00:00Z

objective: >-
  Give the background-service deployment (windows-background-service) a
  lightweight interactive affordance instead of requiring users to remember
  a port number and open a browser tab manually. Add a new cmd/tray binary
  (alongside the existing cmd/server layout) using fyne.io/systray — the
  actively maintained fork of getlantern/systray that drops its GTK
  dependency, backed by plain Win32 syscalls on Windows (no CGO) —
  confirmed actively maintained as of 2026. Menu: live status (polling GET
  /healthcheck), "Open in browser", and "Quit" (clean shutdown, no orphaned
  claude subprocess).

constraints:
  - "Depends on graceful-shutdown and windows-background-service."
  - "Windows-first, same as windows-background-service; no macOS/Linux systray work in this task."

assumptions:
  - "Open question to resolve before implementation: does the tray *own* the server's process lifetime directly (imports and runs run(ctx) in-process, or spawns server.exe as a child), or does it *supervise* an already-installed Windows Service (status/shortcut UI only, Quit stops the service via SCM)? A service has no desktop interaction session by default, while a tray icon needs one, so these are two different process models and the choice changes what this task actually launches."
  - "If HTTP_ADDR's port becomes dynamically chosen (to avoid conflicts) rather than the fixed :8080 default, the tray needs to learn the resolved port from the same config source the server reads, not a hardcoded value — needs deciding alongside windows-background-service."

success_criteria:
  - Launching the tray binary shows an icon whose status reflects real /healthcheck state (verified by toggling the LLM backend on/off).
  - "\"Open in browser\" opens the correct host:port."
  - "\"Quit\" performs a full graceful shutdown (no orphaned claude subprocess) and removes the tray icon."

references:
  knowledge:
    - docs/engineering conventions.md
  repo:
    - cmd/server/main.go
    - internal/api/router.go
