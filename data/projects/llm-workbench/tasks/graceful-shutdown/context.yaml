summary: 'Give cmd/server/main.go a real shutdown path: http.Server + Shutdown(ctx) on cancellation, run(ctx) extracted from main() for reuse by future service/tray modes, and ClaudeRunner.CloseAll() to disconnect cached claude CLI clients so no subprocess is orphaned.'
background: main.go currently calls http.ListenAndServe directly with no http.Server, no signal handling, and no Shutdown(ctx) - Ctrl+C or a service-stop kills the process hard, with no chance to drain in-flight requests or disconnect any live claude CLI subprocesses held open by ClaudeRunner's per-session client cache. This is foundational for both windows-background-service and windows-systray-icon, which both need a clean stop path (SCM stop requests and a tray Quit action) rather than relying on OS signals alone.
files:
    - cmd/server/main.go
    - internal/agentrunner/claude_runner.go
    - internal/utils/env.go
detail: ""
verification:
    - description: make build && run the binary in console mode, confirm normal startup/serving is unchanged
      kind: human_judgment
    - description: Start a claude-code chat session to spawn a real claude CLI subprocess, then Ctrl+C the server, and confirm (e.g. via process list) no orphaned claude process remains
      kind: human_judgment
    - description: Confirm process exit happens within SHUTDOWN_TIMEOUT (default 10s) under normal conditions
      kind: human_judgment
