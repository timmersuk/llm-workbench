      content: |-
        The requirements are locked in and proposed for your review:

        **Objective:** Extract `main()`'s bootstrap into `run(ctx context.Context) error`; replace `http.ListenAndServe` with `http.Server{}` + `Shutdown(ctx)` on cancellation, bounded by a new `SHUTDOWN_TIMEOUT` (default 10s, `GetEnvDefault` pattern); add `ClaudeRunner.CloseAll()`, invoked via type assertion from the shutdown path, to disconnect cached claude CLI clients.

        **Constraints:** no change to console/dev-mode behavior beyond clean Ctrl+C shutdown; no new config mechanism; no new runtime deps; follow engineering conventions; type-assertion (not `AgentRunner` interface) for the cleanup hook.

        **Assumptions:** `signal.NotifyContext` works fine on Windows for console mode; `run(ctx)` must accept cancellation from non-signal sources for the future Windows Service to reuse it; a shared cleanup interface can wait until a second CLI-backed executor exists.

        **Success criteria:** no orphaned `claude` subprocess after starting a session and stopping the server; exit within `SHUTDOWN_TIMEOUT`; console/dev-mode behavior otherwise unchanged.

        This is now with you for final review before it's finalized.
