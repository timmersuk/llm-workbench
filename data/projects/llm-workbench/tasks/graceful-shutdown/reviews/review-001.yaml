decision: approved
notes: |-
    Task: add graceful shutdown to cmd/server/main.go (run(ctx) error, http.Server + bounded Shutdown, ClaudeRunner.CloseAll() invoked via type assertion, SHUTDOWN_TIMEOUT via existing GetEnvDefault pattern).

    Phase 1 — Automated checks:
    - Build clean (go build ./..., plus standalone cross-compile windows/amd64).
    - Full test suite passes; forced -count=1 re-run on both touched packages confirms the new tests actually execute.
    - go vet clean.
    - gofmt flags main.go/claude_runner.go/claude_runner_test.go, but this traces to a pre-existing repo-wide CRLF artifact (core.autocrlf=true) — an untouched file (router.go) shows the identical complaint. Not introduced by this diff, not a real finding.
    - Standards/spec match the task precisely: loadConfig()/run(ctx, cfg) error split, main() remains sole Fatal/os.Exit point; SHUTDOWN_TIMEOUT via utils.GetEnvDefault exactly like AGENT_TIMEOUT/LLM_TIMEOUT (default 10s); http.Server{} + Shutdown(ctx) with bounded context.WithTimeout replaces bare ListenAndServe; ClaudeRunner.CloseAll() added and invoked only via interface{ CloseAll() } type assertion — confirmed AgentRunner interface untouched, and neither ChatClientRunner nor CodexRunner gained a stub (they don't implement CloseAll, correctly excluded). No new dependency (only stdlib os/signal added). docs/engineering conventions.md updated accurately with a new "Graceful shutdown" section. run(ctx, cfg) takes a plain context.Context (not wired directly to os/signal inside run), satisfying the future Windows-service-reuse assumption.

    Phase 2 — Test-meaningfulness:
    - TestClaudeRunner_CloseAll_DisconnectsEveryCachedClientAndClearsCache: genuine, fails if Disconnect isn't called per-client or cache isn't cleared.
    - TestClaudeRunner_CloseAll_OnEmptyCacheIsANoOp: low value alone but consistent with existing no-op-key test convention.
    - TestRun_ShutsDownGracefullyOnContextCancel: verifies real plumbing (ctx cancel -> Shutdown -> CloseAll -> clean return within timeout), but exercises an empty client cache, so it can't itself catch a regression where CloseAll is wired to the wrong runner or skipped — that assertion lives in test #1. Noted as an acceptable division of labor / minor unit-vs-integration gap, not a blocking flaw.
    - TestRun_ReportsListenError: meaningful, protects the "main() is the sole Fatal point" invariant via a real address-in-use failure.

    Phase 3 — Human verification (all confirmed "all good" by user):
    - make build && run in console mode: normal startup/serving unchanged.
    - Started a claude-code chat session (real claude CLI subprocess) then Ctrl+C'd the server: no orphaned claude process remained.
    - Process exit occurs within SHUTDOWN_TIMEOUT (default 10s) under normal conditions.

    No blocking findings. Approved.
