approach: 'Add graceful shutdown to cmd/server/main.go without changing today''s console/dev-mode behaviour beyond clean exit-on-Ctrl+C. Split main() into: (1) loadConfig() config — a new helper holding all of today''s utils.GetEnvDefault/utils.MustGetEnv calls verbatim (env parsing, including the process-exiting MustGetEnv), plus a new shutdownTimeout := utils.GetEnvDefault("SHUTDOWN_TIMEOUT", 10*time.Second) following the same pattern as AGENT_TIMEOUT/LLM_TIMEOUT; (2) main() — reduced to building ctx via signal.NotifyContext(context.Background(), os.Interrupt) with deferred stop(), cfg := loadConfig(), and if err := run(ctx, cfg); err != nil { logrus.WithError(err).Fatal(...) }, making main() the sole os.Exit path; (3) run(ctx context.Context, cfg config) error — everything else currently in main() (configureLogging, store construction, agentRunners map, fs.Sub, router construction, startup log), with Fatalf calls converted to error returns. run() builds srv := &http.Server{Addr: cfg.httpAddr, Handler: router}, starts it in a goroutine reporting to an error channel, and selects between ctx.Done() and that channel. On ctx.Done(), it creates a bounded shutdownCtx (context.WithTimeout(context.Background(), cfg.shutdownTimeout)), calls srv.Shutdown(shutdownCtx), then iterates registered agentRunners doing a type assertion (interface{ CloseAll() }) — not an AgentRunner interface method — to trigger cleanup, then returns nil (ignoring http.ErrServerClosed). A real ListenAndServe error is returned as-is. Separately, ClaudeRunner (internal/agentrunner/claude_runner.go) gets a new CloseAll() method that locks its mutex, snapshots and clears the per-session client cache, then disconnects each snapshotted client concurrently via a WaitGroup, ignoring individual Disconnect() errors (mirroring CloseSession''s ignore-error posture); in-flight Execute calls are left untouched (out of scope). No AgentRunner interface change, so ChatClientRunner/CodexRunner need no stub. No new dependencies — only context, net/http, os/signal, sync from stdlib. Document SHUTDOWN_TIMEOUT in docs/engineering conventions.md alongside AGENT_TIMEOUT/LLM_TIMEOUT. This design keeps main() as the only process-exit path, gives run(ctx) an OS-agnostic cancellation source (satisfying the future windows-background-service reuse assumption), and confines the claude-CLI-specific cleanup behind a narrow type assertion rather than polluting the shared interface.'
steps:
    - Add `config` struct and `loadConfig() config` helper in cmd/server/main.go, moving all existing utils.GetEnvDefault/utils.MustGetEnv calls into it verbatim, and add shutdownTimeout := utils.GetEnvDefault("SHUTDOWN_TIMEOUT", 10*time.Second) to it
    - 'Rewrite main() to: build ctx via signal.NotifyContext(context.Background(), os.Interrupt) with defer stop(); cfg := loadConfig(); call run(ctx, cfg) and logrus.Fatal on error'
    - Extract run(ctx context.Context, cfg config) error containing today's post-env-read main() body (configureLogging, store, agentRunners map, fs.Sub, router construction, startup log), converting any Fatalf calls to `return fmt.Errorf(...)`
    - In run(), replace the direct http.ListenAndServe call with an http.Server{Addr, Handler}, run ListenAndServe in a goroutine reporting to an error channel, and select on ctx.Done() vs that channel
    - 'On ctx.Done(): build a bounded shutdown context from cfg.shutdownTimeout, call srv.Shutdown(shutdownCtx), then loop over agentRunners doing `if closer, ok := r.(interface{ CloseAll() }); ok { closer.CloseAll() }`, then return nil (swallowing http.ErrServerClosed)'
    - 'Add ClaudeRunner.CloseAll() in internal/agentrunner/claude_runner.go: lock mu, snapshot+clear the client cache map, unlock, then disconnect each snapshotted client concurrently via sync.WaitGroup, ignoring individual Disconnect() errors'
    - Document SHUTDOWN_TIMEOUT in docs/engineering conventions.md next to AGENT_TIMEOUT/LLM_TIMEOUT
    - 'Build (make build) and manually verify: start server, open a claude-code chat session (spawns real claude CLI subprocess), Ctrl+C the server, confirm process exits within SHUTDOWN_TIMEOUT and no orphaned claude process remains (e.g. via ps/tasklist)'
risks:
    - run(ctx, cfg) must not contain any Must*/Fatal-style calls — if a converted Fatalf is missed, a background error could still silently os.Exit from inside run, breaking the 'main() is the only exit path' invariant
    - 'The select between ctx.Done() and the ListenAndServe error channel must not race: if Shutdown(shutdownCtx) is called concurrently with ListenAndServe returning, must ensure the goroutine''s error is drained/ignored (http.ErrServerClosed) rather than causing a duplicate return or deadlock on an unbuffered channel'
    - ClaudeRunner.CloseAll() clearing the client map while a concurrent Run() call is populating/reading it needs the same mutex discipline as existing CloseSession — a missed lock could race or double-disconnect
    - SHUTDOWN_TIMEOUT default of 10s must be long enough for real claude CLI subprocesses to disconnect cleanly, or shutdown could be forcibly cut off mid-cleanup on slower machines
    - Windows-specific behaviour of signal.NotifyContext(os.Interrupt) on Ctrl+C is assumed equivalent to Unix per the stated assumption but isn't verified in this plan beyond manual testing on the dev machine
estimated_complexity: medium
recommended_executor: claude
