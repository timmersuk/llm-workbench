        **Summary of the full design:**

        1. **`config` struct + `loadConfig() config`** (new, in main.go): holds `httpAddr, workspaceRoot, logLevel, logFormat, llmBaseURL, llmAPIKey, llmModel, llmTimeout, agentTimeout, agentExecutionTimeout, agentReposRoot, draftMCPPath, shutdownTimeout`. All of today's `utils.GetEnvDefault`/`utils.MustGetEnv` calls move verbatim into this function's body (including the new `shutdownTimeout := utils.GetEnvDefault("SHUTDOWN_TIMEOUT", 10*time.Second)`, alongside `agentTimeout`/`llmTimeout`).

        2. **`main()`** shrinks to: build `ctx` via `signal.NotifyContext(context.Background(), os.Interrupt)` (plus `defer stop()`), `cfg := loadConfig()`, `if err := run(ctx, cfg); err != nil { logrus.WithError(err).Fatal(...) }`. This is the sole `os.Exit` path — `loadConfig()`'s internal `MustGetEnv` call also exits before `run` is ever invoked, so `run(ctx, cfg)` itself contains zero `Must*` calls.

        3. **`run(ctx context.Context, cfg config) error`**: holds everything currently in `main()` after the env reads — `configureLogging`, store construction, `agentRunners` map, `fs.Sub` (Fatalf → `return fmt.Errorf(...)`), router construction, the startup log line. Then:
           - builds `srv := &http.Server{Addr: cfg.httpAddr, Handler: router}`
           - starts `go func() { serveErr <- srv.ListenAndServe() }()`
           - `select`s on `ctx.Done()` vs. that error channel
           - on `ctx.Done()`: builds `shutdownCtx, cancel := context.WithTimeout(context.Background(), cfg.shutdownTimeout)`, calls `srv.Shutdown(shutdownCtx)`, then for each registered runner does the `CloseAll` type-assertion cleanup (see below), then returns nil (ignoring `http.ErrServerClosed` from the serve goroutine)
           - on a real `ListenAndServe` error (not `http.ErrServerClosed`): returns it

        4. **`ClaudeRunner.CloseAll()`** (new, in claude_runner.go): locks `r.mu`, snapshots and clears `r.clients`, unlocks, then disconnects each snapshotted client concurrently (one goroutine + `sync.WaitGroup`), ignoring individual `Disconnect()` errors — mirrors `CloseSession`'s ignore-error posture. Scope: only the cached `Run`-session map; in-flight `Execute` calls are untouched (out of scope per your earlier answer).

        5. **Wiring in `run`'s shutdown branch**: `for _, r := range agentRunners { if closer, ok := r.(interface{ CloseAll() }); ok { closer.CloseAll() } }`. No change to the `AgentRunner` interface, so `ChatClientRunner`/`CodexRunner` need no stub.

        6. **`docs/engineering conventions.md`**: add a `SHUTDOWN_TIMEOUT` entry alongside the existing `AGENT_TIMEOUT`/`LLM_TIMEOUT` entries (assuming that's where they're documented — I'll confirm the exact section when writing).

        No new dependency — everything here is `context`, `net/http`, `os/signal`, `sync`, stdlib only.

