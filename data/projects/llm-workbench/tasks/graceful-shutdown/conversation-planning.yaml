      content: |-
        Good — this confirms `CloseSession` already exists and just calls `Disconnect()` ignoring its error, with no context/timeout involved. Now, the `CloseAll` design itself.

        **Q2: Should `CloseAll()` disconnect cached clients serially or concurrently, and does it need to respect a deadline itself?**

        Context: each cached client is a real `claude` CLI subprocess. If a session is idle, `Disconnect()` is presumably fast (kill/close pipes), but with multiple concurrent sessions cached, disconnecting them one-by-one could add up. The overall shutdown is already bounded by `SHUTDOWN_TIMEOUT` wrapping `srv.Shutdown(ctx)` — if `CloseAll()` runs after `Shutdown` returns, using its own unbounded loop, a slow/hanging `Disconnect()` on one client could block the rest and blow past `SHUTDOWN_TIMEOUT` before `run()` returns.**Q2: Should `CloseAll()` disconnect cached clients serially or concurrently, and does it need its own deadline?**

        Each cached client is a real `claude` CLI subprocess; `Disconnect()`'s cost per client is unknown but plausibly non-trivial. `CloseAll()` runs after `srv.Shutdown(ctx)` returns, inside the same `run(ctx)` shutdown path — so however long it takes adds to the total time before the process exits, and the whole thing needs to fit in `SHUTDOWN_TIMEOUT`.

        Options:
        1. **Serial, no timeout of its own** — simplest, mirrors `CloseSession` exactly (just looped), but total time is the *sum* of every client's `Disconnect()`.
        2. **Concurrent (goroutine per client + `WaitGroup`), no timeout of its own** — bounds total time to the *slowest single* `Disconnect()` rather than the sum, still no new context-plumbing shape.
        3. **Concurrent + `CloseAll` takes a `context.Context`** so it can abandon slow disconnects once the remaining shutdown budget is spent — most robust against a hung subprocess, but adds a shape `CloseSession` doesn't have and `Disconnect()`'s signature may not even support cancellation-while-in-flight (worth checking against the SDK before committing to it).

        I'd lean toward **option 2**: concurrent, no timeout of its own. It's the smallest change that meaningfully reduces total shutdown time (parallel rather than serial), stays consistent with `CloseSession`'s existing "fire Disconnect, ignore its error" shape, and doesn't require deciding what `Disconnect()` does when its parent context is cancelled mid-call (which may not even be a thing the SDK supports). A hung individual `Disconnect()` is already bounded at the outer level by `run(ctx)`'s `SHUTDOWN_TIMEOUT` racing against process exit.
