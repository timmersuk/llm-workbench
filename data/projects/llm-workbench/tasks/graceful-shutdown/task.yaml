id: graceful-shutdown
title: Add graceful shutdown to the server process
project: llm-workbench
stage: merged
created_at: 2026-07-07T00:00:00Z
updated_at: 2026-07-25T20:59:07.4220617Z
objective: 'Add graceful shutdown to cmd/server/main.go: extract main()''s bootstrap into a run(ctx context.Context) error function; build an http.Server{} (replacing the direct http.ListenAndServe call) and call Shutdown(ctx) with a bounded timeout when ctx is cancelled; add a CloseAll()-style method to ClaudeRunner (internal/agentrunner/claude_runner.go) that disconnects every cached per-session claude CLI client, invoked from the shutdown path via a type assertion (not an AgentRunner interface method) so no claude subprocess is orphaned on exit.'
constraints:
    - Must not change today's console/dev-mode behaviour (make build && run the binary) beyond adding clean shutdown-on-Ctrl+C.
    - SHUTDOWN_TIMEOUT should follow the existing GetEnvDefault pattern used for AGENT_TIMEOUT/LLM_TIMEOUT, not a new config mechanism; default 10s.
    - 'No new runtime dependency without a stated reason (project architectural invariant: prefer open standards).'
    - Follow docs/engineering conventions.md for implementation choices.
    - The shutdown-cleanup hook is added via a type assertion in main.go's shutdown path (e.g. interface{ CloseAll() }), not by adding a method to the AgentRunner interface, so ChatClientRunner (which owns nothing to close) doesn't need a no-op stub.
assumptions:
    - Windows console apps receive Ctrl+C via signal.NotifyContext(os.Interrupt) the same as Unix, so this doesn't need OS-specific signal code.
    - A Windows Service's stop request does not arrive as a POSIX signal - it comes through the service control dispatcher - so run(ctx) must accept cancellation from a source other than os/signal, for windows-background-service to reuse it later.
    - If a second CLI-backed executor (e.g. codex) is added later and also needs cleanup, a shared named interface (still not folded into AgentRunner) can be reused at that point; not needed now.
success_criteria:
    - Starting a claude-code chat session (which spawns a real claude CLI subprocess) and then stopping the server (Ctrl+C) leaves no orphaned claude process running.
    - The process exits within the configured SHUTDOWN_TIMEOUT under normal conditions.
    - Existing console/dev-mode behaviour (make build && run) is unchanged except for the new clean-shutdown-on-Ctrl+C path.
references:
    knowledge:
        - docs/engineering conventions.md
    repo:
        - cmd/server/main.go
        - internal/agentrunner/claude_runner.go
