id: execute-bash-tool
title: Add the cwd-confined bash tool to the Execute toolset
project: llm-workbench

status: complete

stage: complete

created_at: 2026-07-11T00:00:00Z
updated_at: 2026-07-12T00:00:00Z

objective: >-
  Complete the Execute instantiation's toolset (internal/toolloop) with a
  native `bash` tool — the last tool after Read/Grep/Glob (PR 2) and
  Write/Edit (PR 3). Bash was always in Milestone 8's scope but sequenced last,
  landing once the loop itself was proven against the lower-risk tools (see
  docs/milestones/milestone8.md, "Bash: scope and posture"). The tool runs a
  shell command from the execution worktree, feeding combined stdout/stderr
  back to the model, so the `local` executor can build/test/run code the way
  ClaudeRunner and CodexRunner already do. Delivered by PR #20 (commit
  fda9bfe).

constraints:
  - "Confinement is cwd-only: cmd.Dir pinned to the execution worktree, no OS-level sandbox (no Landlock, no containers) in v1, matching the trust level ClaudeRunner/CodexRunner already operate at (docs/adr/0010-defer-bash-sandboxing-for-execution-harness.md)."
  - "Git-for-Windows bash.exe on Windows (already a hard dependency via worktrees), system bash elsewhere; a genuine 'bash not found' is the tool's only hard error."
  - "2-minute default per-command timeout; a killed command reports its partial output rather than aborting the loop."
  - "Combined stdout/stderr capped at ~20KB with an explicit truncation marker, consistent with the other tools' fixed caps (the tunable knob is deferred to tool-output-caps-config)."
  - "A non-zero exit is model-visible signal (exit status appended), not a loop-aborting Go error; only a failure to launch bash is a real error."
  - "No engine change: bash is one more toolloop.Tool, since the engine already routes calls by name and confines every tool to the workspace."

assumptions:
  - "Killing bash.exe on Windows does not close pipes an inherited grandchild (e.g. sleep) still holds; cmd.WaitDelay force-closes the I/O shortly after the kill, and the orphan finishes in the background — acceptable under the no-sandbox posture."
  - "OS-level hardening (Landlock on Linux, Sandboxie on Windows) is a separate future pass, footnoted in ADR 0010, not part of this task."

success_criteria:
  - "bash tool implemented in internal/toolloop and wired into toolloop.ExecutionTools() — MET (internal/toolloop/tools_bash.go)."
  - "Unit coverage for run/cwd-confinement/stderr/non-zero-exit/no-output/timeout-kill/truncation/validation/wiring — MET (12 tests in tools_bash_test.go)."
  - "Live end-to-end run against a real model exercises the tool with correct cwd confinement — MET (openai/gpt-oss-20b via LM Studio drove `wc -l data.txt`, resolving the relative path from the worktree; 3 turns, 2239 tokens, 8.8s)."

