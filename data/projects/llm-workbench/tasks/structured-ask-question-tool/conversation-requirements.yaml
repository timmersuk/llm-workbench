        Good, that confirms `ask_question` doesn't fit the existing `SecondaryDraftConfig` shape (accept/reject a staged draft) — it needs its own render path: buttons that fire `sendMessage` immediately, coexisting with the free-text box already there. That's an implementation detail I can fold into the plan without asking.

        One schema fork remains, and it's genuinely a product call, not something the code resolves for me.

        **Question 5: Does the question's actual text live in the tool call's schema (e.g. a `question` field), or does the model keep writing the question as normal assistant prose in the same message, with the tool call carrying only `options` + `recommended_option_id` + the recommendation's reason?**

        My recommended default: **question stays in prose, the tool call carries only the structured choice data** (options, recommendation, reason) — no `question` field. Reason: `DisplayMessage` already renders `content` and `toolCallName` together in the same bubble (`StageConversationPanel.tsx` line 686-687), so a tool call already sits alongside prose without needing to duplicate it — the model would otherwise have to write the question twice (once for the human to read, once in a schema field) with no clear source of truth if they drift. Keeping prose as the question's only home also means the "recommended answer and a short reason why" framing your system prompt already uses barely changes — the model just adds a tool call instead of writing the options as a bullet list at the end.

        Does that match your intent, or did you want the question text captured in the schema too (e.g. for stricter validation, or so the frontend can render the question separately from any other prose in the same turn)?
