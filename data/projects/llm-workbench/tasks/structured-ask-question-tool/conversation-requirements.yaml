      content: |-
        Good, that matches. Now let me look at the actual code that this decision needs to slot into, so the remaining questions are grounded rather than blind.This confirms the mechanism precedent nicely: `SecondaryDraftConfig` shows a tool can coexist with `propose_context` without ending the "conversation" in the Finalize sense, and `conversationHistoryToChatMessages` shows tool calls are already flattened to plain text for replay — there's no real protocol-level tool-result turn to preserve. That answers "how does this wire into the existing turn loop" without needing to ask you. One real product fork remains from this: what the human's answer actually becomes in the transcript.

        **Question 4: When the user clicks an option (or the recommendation), what text gets sent back to the model as the next turn — the option's label verbatim, indistinguishable from if the user had typed it themselves, or something that marks it as "selected option X of an ask_question call" for transcript clarity?**

        My recommended default: **send the option's label verbatim as a plain chat message**, through the exact same `sendMessage`/`postStageMessage` path free text already uses — no new wrapping, no tool-result protocol plumbing. Reason: the codebase already flattens tool calls to prose annotations for replay (`conversationHistoryToChatMessages`), and `handleRequestChanges` already proves the pattern of "turn a UI action into a plain user message via the existing send path" — reusing it means zero new backend surface for the *answer* side, only the *question* side (the tool schema) is new. The cost is that a transcript reader can't tell "clicked" from "typed" after the fact, but that mirrors today's reality (a user typing "agreed" already erases that distinction), so it's not a regression.

        Does that match your intent, or did you want the click preserved as a distinguishable, structured event in the transcript?
