        arguments: '{"assumptions":["The existing Requirements-stage interview flow (grill-with-docs style) is the primary consumer; scope should start there rather than trying to cover every future interview-shaped interaction up front.","Free text is always available alongside rendered options, even when options + a recommendation are present; the recommendation is pre-selected/highlighted but never auto-submitted, and the user can pick a different option, pick the recommendation, or ignore all options and type a custom answer.","Each ask_question call is single-select only — one option (or free text) chosen per call; multi-select is out of scope, since the interview discipline this replaces is explicitly one question/one decision per turn, and combined answers belong in free text or as separate follow-up questions.","The `options` field is always required (minimum length 1), and the recommended option is always one of the listed options — never a separate free-text-only recommendation mode. This keeps the schema uniform: no conditional ''sometimes chips, sometimes just a textbox'' rendering path.","When the user selects an option (clicked or typed to match), the option''s label round-trips as plain text through the existing sendMessage/postStageMessage path, indistinguishable from a typed answer — no new tool-result protocol or structured transcript event. This mirrors the existing precedent (e.g. handleRequestChanges) of turning a UI action into a plain user message via the existing send path, and matches how tool calls are already flattened to prose for replay (conversationHistoryToChatMessages). Re-evaluating this plain-textification (e.g. to preserve ''clicked vs typed'' provenance) is explicitly deferred, not ruled out.","The question''s text stays in normal assistant prose in the same message, not in a schema field; the ask_question tool call itself carries only the structured choice data — options, recommended_option_id, and a short reason for the recommendation. This avoids the model writing the question twice with no single source of truth, and fits the existing rendering precedent where DisplayMessage already shows content and toolCallName together in the same bubble.","This ships as this Task''s own implementation plan once it reaches the llm-workbench workflow''s `planning` stage (task.yaml -\u003e plan.yaml), not as a separate milestone doc — Milestones 8/8a/8b/9 are all already shipped and there is no in-flight milestone to fold this into, and the Task lifecycle itself (requirements -\u003e planning -\u003e implementation -\u003e review -\u003e pr_review -\u003e merged) is the mechanism for scoping the implementation plan going forward."],"constraints":["Should compose with the existing one-question-per-turn interview discipline rather than replace its intent, only its transport (structured tool call vs. prompt text).","Follow docs/engineering conventions.md for implementation choices.","No new runtime dependency without a stated reason (see architectural invariants: prefer open standards)."],"context":{"background":"GrillMe''s Requirements-stage interview currently follows a prompt-only discipline: one question per turn, with a recommended answer written into the assistant''s prose and no structured UI affordance — the user reads it and types a reply. This task replaces that transport with a structured tool call (`ask_question`) modeled on the existing Draft tool pattern (`propose_context`, and the two-tool coexistence precedent from `propose_review` + `propose_knowledge` via `stageTool()`), so the frontend can render clickable options with a pre-highlighted recommendation, while free text remains the escape hatch for nuanced or combined answers. The tool is scoped to carry only the structured choice data (options, recommended_option_id, reason) — the question itself remains assistant prose in the same message, consistent with how `DisplayMessage` already renders content and toolCallName together. Selecting an option (including the recommendation) round-trips as a plain chat message through the existing sendMessage path, the same as if the user had typed it — no new tool-result protocol. This plain-textification is expected to need re-evaluation later (e.g. to preserve click-vs-typed provenance in the transcript) but that is explicitly out of scope now.","detail":"Six design decisions were resolved in interview, in dependency order: (1) free text is always available alongside rendered options, never gated behind an ''options absent'' mode; (2) ask_question is single-select only, no multi-select, to preserve the one-decision-per-turn discipline; (3) options is always required with min length 1, and the recommendation is always one of the listed options rather than a separate free-text-only field, keeping the schema and frontend rendering uniform; (4) the selected answer (option label or free text) round-trips as a plain user message via the existing sendMessage/postStageMessage path with no new structured transcript event, matching existing precedent (handleRequestChanges, conversationHistoryToChatMessages flattening tool calls to prose); (5) the question text itself lives only in assistant prose, not in a schema field — the tool call carries only options + recommended_option_id + reason; (6) this ships via this Task''s own plan at the `planning` stage of the llm-workbench Task workflow, not as a new standalone milestone doc, since Milestones 8/8a/8b/9 are all already shipped.","files":["docs/engineering conventions.md","docs/architectural invariants (implied: open standards / no new runtime deps)","backend Draft tool definitions (e.g. drafttool.Definition, propose_context, propose_review/propose_knowledge stageTool() pattern)","frontend StageConversationPanel.tsx (DisplayMessage rendering of content + toolCallName)","conversationHistoryToChatMessages (tool-call-to-prose flattening for replay)","data/projects/llm-workbench/tasks/structured-ask-question-tool/task.yaml","data/projects/llm-workbench/tasks/structured-ask-question-tool/conversation-requirements.yaml"],"open_questions":[],"summary":"Design an `ask_question` Draft-style tool that gives the model''s Requirements-stage interview a structured way to offer multiple-choice answers with a highlighted recommendation, rendered as clickable chips in the frontend, while keeping free text as an always-available equal alternative and preserving the existing one-question-per-turn interview discipline.","verification":[{"description":"Once implemented, exercise a Requirements-stage GrillMe interview and confirm ask_question renders clickable option chips with the recommendation pre-highlighted, free text remains available and unsubmitted-by-default, and selecting an option or typing free text sends a plain chat message indistinguishable from manual typing.","kind":"human_judgment"},{"description":"Confirm the ask_question tool schema validates: options array min length 1, recommended_option_id required and must reference a listed option, no question-text field in the schema.","kind":"agent_executable"}]},"objective":"Replace the current prompt-only interview discipline (one question per turn, a recommended answer written into the prompt text, no structured UI affordance) with a structured `ask_question` tool: options plus a recommendation as a first-class object, rendered as clickable choices in the frontend rather than free-text the user has to read and retype.","success_criteria":["A concrete design exists for the ask_question tool''s schema (options, recommendation, free-text fallback) and how the frontend renders the options/recommendation and collects the answer (including the recommendation''s plain sendMessage round-trip).","The implementation is scoped as this Task''s own plan, produced via the llm-workbench Task workflow''s `planning` stage, rather than as a separate milestone document."]}'
