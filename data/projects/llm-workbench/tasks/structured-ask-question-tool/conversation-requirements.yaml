        My recommended default: **its own standalone milestone** (next number — Milestone 10), scoped narrowly to just this tool (schema + Requirements-stage wiring + frontend render/collect path), not bundled with unrelated work. Reason: Milestones 8, 8a, 8b, and 9 are all shipped/done (`docs/milestones/done/`), so there's no in-flight milestone to fold into — and Milestone 9 is a direct structural precedent for "one new Draft tool, one dedicated milestone" (`propose_knowledge` got its own milestone doc rather than being tacked onto something else, even though it was similarly self-contained). This also directly satisfies your success criteria's first branch ("an implementation plan is scoped into a milestone") rather than the fallback branch of deciding prompt-only interviews remain sufficient — which nothing in this design conversation has pointed toward.

