        That means success criteria's second bullet needs a small edit to match reality — from "scoped into a milestone" to "scoped via this task's own planning stage." Here's where all six decisions now stand:

        1. **Free text always available** alongside rendered options; recommendation pre-selected/highlighted, never auto-submitted.
