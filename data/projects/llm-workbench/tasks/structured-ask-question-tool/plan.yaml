approach: 'Add `ask_question` as a new Draft-style tool (options: string[], recommended_option: string, recommendation_reason: string) alongside the existing propose_context/propose_plan tools, wire it into both Requirements'' and Planning''s stage tool lists, reword their shared interview-discipline prompt text to route the "recommended answer" rule through this tool call instead of prose, and give StageConversationPanel a third rendering category (pendingQuestion) — option buttons with the recommendation highlighted, sitting beside the normal free-text box, where a click fires the same sendMessage path a typed reply uses.'
steps:
    - internal/drafttool/drafttool.go — add AskQuestionName, askQuestionSchema (options required array min 1 item; recommended_option; recommendation_reason), AskQuestion Definition, add to All().
    - internal/api/stage_conversation.go — append chatToolFor(drafttool.AskQuestion) in stageTool()'s StageRequirements and StagePlanning cases only; reword the "recommended answer" bullet in grillMeSystemPrompt/planningModeSystemPrompt to direct the model to call ask_question (question text still in prose, options/recommendation in the tool call) rather than write it inline.
    - frontend/src/StageConversationPanel.tsx — add askQuestionToolName = 'ask_question' constant (mirrors ReviewPanel.tsx's existing proposeKnowledgeToolName pattern), a pendingQuestion state, a branch in both the live handleStreamEvent tool-call handling and the rehydration walk that recognizes this name before the main/secondary bucketing (so it's never misparsed as a RequirementsDraft/TaskPlan), a narrower rehydration rule (only resurface if ask_question is on the last loaded message), rendering of option buttons (recommendation visually distinguished) next to the existing textarea, click -> sendMessage(label) + clear pendingQuestion, and clearing it in truncateAndResend alongside pendingDraft.
    - 'Extend GrillMePanel.test.tsx/PlanningModePanel.test.tsx (already exercise tool_call delivery) with cases for: option rendering + recommendation highlight, click sends the label, free text still works alongside options, rehydration only on last-message, and a mismatched recommended_option degrading silently (no highlight, all options still shown).'
    - Manual check with the claude-code executor on a real Requirements and Planning conversation, confirming the model actually calls ask_question (not just prose) and the clicked option is indistinguishable from typed text in the transcript.
risks:
    - Prompt wording alone doesn't guarantee the model calls the tool instead of asking in plain prose — needs the real end-to-end check in step 5, not just unit tests.
    - Silent degradation on a mismatched recommended_option (no validation anywhere) is accepted by design, but worth confirming a fully missing options array (schema violation) doesn't crash the render rather than just showing no buttons.
    - Plain-text round-tripping means "clicked vs. typed" provenance is unrecoverable from the transcript — known, deferred limitation, not a bug.
estimated_complexity: low
recommended_executor: claude-code
