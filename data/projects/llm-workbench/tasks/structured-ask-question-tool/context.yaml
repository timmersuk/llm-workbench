summary: Design an `ask_question` Draft-style tool that gives the model's Requirements-stage interview a structured way to offer multiple-choice answers with a highlighted recommendation, rendered as clickable chips in the frontend, while keeping free text as an always-available equal alternative and preserving the existing one-question-per-turn interview discipline.
background: 'GrillMe''s Requirements-stage interview currently follows a prompt-only discipline: one question per turn, with a recommended answer written into the assistant''s prose and no structured UI affordance — the user reads it and types a reply. This task replaces that transport with a structured tool call (`ask_question`) modeled on the existing Draft tool pattern (`propose_context`, and the two-tool coexistence precedent from `propose_review` + `propose_knowledge` via `stageTool()`), so the frontend can render clickable options with a pre-highlighted recommendation, while free text remains the escape hatch for nuanced or combined answers. The tool is scoped to carry only the structured choice data (options, recommended_option_id, reason) — the question itself remains assistant prose in the same message, consistent with how `DisplayMessage` already renders content and toolCallName together. Selecting an option (including the recommendation) round-trips as a plain chat message through the existing sendMessage path, the same as if the user had typed it — no new tool-result protocol. This plain-textification is expected to need re-evaluation later (e.g. to preserve click-vs-typed provenance in the transcript) but that is explicitly out of scope now.'
files:
    - docs/engineering conventions.md
    - 'docs/architectural invariants (implied: open standards / no new runtime deps)'
    - backend Draft tool definitions (e.g. drafttool.Definition, propose_context, propose_review/propose_knowledge stageTool() pattern)
