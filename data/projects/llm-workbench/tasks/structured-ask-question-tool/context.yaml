detail: 'Six design decisions were resolved in interview, in dependency order: (1) free text is always available alongside rendered options, never gated behind an ''options absent'' mode; (2) ask_question is single-select only, no multi-select, to preserve the one-decision-per-turn discipline; (3) options is always required with min length 1, and the recommendation is always one of the listed options rather than a separate free-text-only field, keeping the schema and frontend rendering uniform; (4) the selected answer (option label or free text) round-trips as a plain user message via the existing sendMessage/postStageMessage path with no new structured transcript event, matching existing precedent (handleRequestChanges, conversationHistoryToChatMessages flattening tool calls to prose); (5) the question text itself lives only in assistant prose, not in a schema field — the tool call carries only options + recommended_option_id + reason; (6) this ships via this Task''s own plan at the `planning` stage of the llm-workbench Task workflow, not as a new standalone milestone doc, since Milestones 8/8a/8b/9 are all already shipped.'
