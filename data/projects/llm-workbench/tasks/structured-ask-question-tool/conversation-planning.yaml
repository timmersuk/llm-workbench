      content: |-
        Good — that grounds the third-category design concretely against the actual component. One more consequential fork falls out of this: **rehydration semantics differ for `ask_question` versus the existing two categories.**

        The current walk (lines 229–260) finds the *most recent* tool call of each kind anywhere in the loaded history, regardless of what came after it — correct for `pendingDraft`/`pendingSecondaryDraft`, since those only clear via an explicit Finalize/Discard/Accept/Reject action, so a draft proposed mid-conversation is still "pending" even if the human kept chatting afterward without acting on it.

        `ask_question` doesn't work that way: per the earlier agreement, clicking an option (or typing a matching answer) immediately fires `sendMessage`, indistinguishable from a normal reply. So if the human already replied after the model's `ask_question` call, the question is *answered* — there's no separate accept/reject state, the next message *is* the answer. Reusing the same "most recent anywhere" walk would incorrectly resurface stale option buttons on reload even after the human already answered by typing something else entirely.

        That means `pendingQuestion` needs a narrower rehydration rule: only resurface it if the `ask_question` tool call is on the *last* loaded message (i.e., nothing after it yet) — not "most recent regardless of position" like the other two.

        **My recommendation:** adopt this narrower rule (last-message-only) for `pendingQuestion`'s rehydration, distinct from `pendingDraft`/`pendingSecondaryDraft`'s walk — it's a small isolated check (`loaded.length > 0 && loaded[loaded.length-1].tool_call?.name === AskQuestionName`) and matches the actual "answered by next message" semantics, whereas reusing the existing walk would show stale buttons the human has already effectively dismissed by replying.

        Do you want this last-message-only rehydration rule for `pendingQuestion`, or would you rather it use the same "most recent anywhere" walk as the other two for implementation uniformity (accepting that stale buttons could resurface)?
