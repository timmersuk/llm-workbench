        Good — that confirms the mechanism precisely: the backend (`stageTool()`) is the sole gate on *which stages* offer a tool at all (`offersToolNamed` silently drops anything not offered), while the frontend's bucketing (`secondaryDraft.toolName` vs. fallthrough "main") is pure client-side name-matching with no backend coordination needed beyond that gate.

        That raises the next fork: how `ask_question` recognition gets wired into `StageConversationPanel`. Two ways:

        **A. New opt-in prop**, e.g. `enableAskQuestion?: boolean`, mirroring `secondaryDraft`/`autoStart` — each call site (`GrillMe.tsx`, the Planning panel) explicitly turns it on.

        **B. Always-on, hardcoded by name** — `StageConversationPanel` unconditionally checks `toolCall.name === drafttool.AskQuestionName` (well, its frontend constant equivalent) as a third branch, no new prop at all. Review's call site just never sees that name in its tool-call stream, since backend `stageTool()` never offers it there — so the branch is dead-but-harmless for Review, not something that needs suppressing.

        **My recommendation: B.** Unlike `secondaryDraft` (genuinely different per stage — heading, custom `renderDraft`, accept/reject callbacks tied to Review's knowledge-concept shape), `ask_question`'s rendering and send-behavior are fully generic and identical wherever it's used — there's nothing for a per-stage config object to parametrize. Making it a prop would just be a second place (call site) that has to agree with `stageTool()`'s switch statement on which stages get it, with no benefit since the backend gate already makes that agreement automatic.

        Do you want A (opt-in prop per call site) or B (always-on, hardcoded by tool-call name)?
