        Good, I have a clear picture of the parsing/render precedent now. One more concrete design point remains before I can write a coherent plan.Now I have the full picture of both the backend gate and the frontend parsing precedent. One more concrete design point before I can write a coherent plan: what happens if the model's `recommended_option` string doesn't exactly match any entry in `options` (a typo, or paraphrasing instead of copying verbatim)?

        I see two options, both consistent with existing precedent (`mergeDraftDefaults`/JSON.parse calls are wrapped in `try/catch` with silent no-op comments like "Malformed arguments JSON... the human can keep chatting"):

        **A. Silent graceful degradation** — render all the option buttons normally, but skip highlighting any of them as "recommended" if `recommended_option` doesn't match an exact entry (treat it the same as "no recommendation" rather than an error). No validation anywhere, Go or TS.

        **B. Reject the tool call** — server-side, `stage_conversation.go` decodes the `ask_question` args and checks `recommended_option ∈ options` before accepting it as a Draft-equivalent proposal; a mismatch gets treated like the existing "hallucinated tool call" path (logged, `toolCall = nil`, effectively ignored so the model's prose still shows but no buttons render).

        **My recommendation: A.** Nowhere else in this codebase validates a Draft tool's argument *content* server-side — `offersToolNamed` only checks the tool *name* matches, never decodes/validates schema-level field relationships (e.g. `estimated_complexity`'s enum isn't cross-checked either). Adding validation only for `ask_question` would be a new pattern with no precedent, for a low-stakes failure mode (worst case: one option button isn't visually highlighted, the user can still click any of them or type free text).

        Do you want A (silent graceful degradation, no validation), or B (server-side validation that rejects a mismatched tool call)?
