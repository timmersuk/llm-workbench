      content: |-
        Good — wiring both stages confirmed. Next fork: the `ask_question` schema's actual shape for options.

        I looked at `internal/drafttool`'s existing schemas (`propose_plan`, `propose_review`, etc.) — they're all flat JSON Schema with plain string/array fields, no id-indirection anywhere. And `StageConversationPanel.tsx` shows the existing precedent for turning a tool call's structured data into a plain `sendMessage(text)` call (`handleRequestChanges`, `handleSecondaryDecision`) — nothing in the frontend currently needs a stable id to correlate back to, since the round-trip target is just the label text itself.

        That points to two ways to shape `options`:

        **A. Plain strings** — `options: string[]`, `recommended_option: string` (must exactly match one entry), `recommendation_reason: string`. No id concept at all; recommending an option means writing its exact text twice (once in the array, once in `recommended_option`).

        **B. `{id, label}` objects** — `options: [{id, label}]`, `recommended_option_id: string`. The model references options by a short stable id instead of repeating the full label text, and clicking renders/sends `label`.

        **My recommendation: A (plain strings).** It matches the codebase's existing schema style (no other Draft tool uses id-indirection), it's less for the model to get right (no risk of `recommended_option_id` typo'd against an `options[].id` that doesn't exist), and since nothing downstream ever needs to look an option up by id — the frontend only ever needs the chosen label text to hand to `sendMessage` — the id buys nothing here. The one thing B would help with (long labels needing a short reference) doesn't apply since there's no second field that needs to reference the option — recommendation *is* the option.

        Do you want plain strings (A), or `{id, label}` objects (B)?
