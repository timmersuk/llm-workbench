        Good — that confirms the shape I'd extend: `drafttool.go` would gain an `AskQuestionName` constant, an `AskQuestion` Definition with schema `{options: string[], recommended_option: string, recommendation_reason: string}`, and it'd flow through `chatToolFor` exactly like the others.

        Now the more consequential fork. I traced how `StageConversationPanel.tsx` currently handles a matched tool call: it buckets every tool call into exactly one of two piles — the stage's **main Draft** (`pendingDraft`, requiring Finalize/Request-changes/Discard) or the **secondary Draft** (`pendingSecondaryDraft`, requiring Accept/Reject, today only Review's `propose_knowledge`). The rehydration walk (lines 213-228) assumes every tool call is one of those two — it doesn't know a third kind could exist.

        `ask_question` doesn't fit either bucket: it's not a reviewable artifact awaiting Finalize, and it's not a create/discard decision awaiting Accept/Reject. Per your existing assumptions, selecting an option should *immediately* fire `sendMessage(optionLabel)` — no separate confirm step, exactly as if the human had typed and hit send.

        That means this needs a **third, lighter category**: a `pendingQuestion` state (parallel to `pendingDraft`/`pendingSecondaryDraft`), populated when a tool call matches `ask_question`'s name, rendered as clickable option buttons (recommendation visually highlighted) sitting alongside the normal free-text input — and the rehydration walk's tool-call bucketing needs a third branch so an `ask_question` call is never mistaken for the stage's main Draft (which would otherwise try to parse its `{options, recommended_option}` args into a `RequirementsDraft`/`TaskPlan` shape and produce garbage).

        **My recommendation:** yes — add this third `pendingQuestion` category rather than trying to force `ask_question` through the existing two mechanisms, since neither's confirm-step semantics (Finalize; Accept/Reject) match "click = send immediately."

        Do you want this third-category approach, or would you rather reuse the existing `secondaryDraft` Accept/Reject mechanism for `ask_question` (with "Accept" meaning "send the recommended option")?
