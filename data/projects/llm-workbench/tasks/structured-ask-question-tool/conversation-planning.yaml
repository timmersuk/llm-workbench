        Good — I've got a solid picture of the existing architecture: `internal/drafttool` defines shared tool schemas consumed by both `ClaudeRunner`/`ChatClientRunner` (native tool calling) and `cmd/draftmcp` (MCP server for `CodexRunner`), `stage_conversation.go`'s `stageTool()` registers per-stage tools and treats any matched tool call as a terminal "Draft" for the turn, and `StageConversationPanel.tsx` renders `toolCallName` as a chip plus a `pendingDraft` review panel below the whole conversation (with a `secondaryDraft` mechanism already precedented for a second independent tool, e.g. `propose_knowledge`).

        One thing stands out as a first fork in the design tree: **which stages get `ask_question` registered.** `grillMeSystemPrompt` (Requirements) and `planningModeSystemPrompt` (Planning) both contain the identical "ask exactly one question per turn, with a recommended answer" discipline text verbatim — only `reviewSystemPrompt` uses a different, phase-based discipline. The task's assumptions say the Requirements-stage flow is "the primary consumer... scope should start there rather than trying to cover every future interview-shaped interaction up front," which could mean either "Requirements only, ship Planning later" or "start scoping from Requirements' shape, but since Planning shares the identical discipline text, wire both now since the marginal cost is one more line in `stageTool()`."

        **My recommendation:** wire `ask_question` into both Requirements and Planning stages in this same plan (not Review), since they share verbatim identical interview-discipline prose — shipping it for only one would leave the other stage's identical rule un-upgraded for no real savings, while Review's different (phased, not one-question-at-a-time) discipline genuinely doesn't fit and stays out.

        Do you want `ask_question` registered for both Requirements and Planning, or Requirements-only for this plan?
