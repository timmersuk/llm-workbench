id: structured-ask-question-tool
title: Add a structured ask_question tool for interview-style turns
project: llm-workbench
status: draft
stage: implementation
created_at: 2026-07-23T00:00:00Z
updated_at: 2026-07-23T21:34:23.7950142Z
objective: 'Replace the current prompt-only interview discipline (one question per turn, a recommended answer written into the prompt text, no structured UI affordance) with a structured `ask_question` tool: options plus a recommendation as a first-class object, rendered as clickable choices in the frontend rather than free-text the user has to read and retype.'
constraints:
    - Should compose with the existing one-question-per-turn interview discipline rather than replace its intent, only its transport (structured tool call vs. prompt text).
    - Follow docs/engineering conventions.md for implementation choices.
    - 'No new runtime dependency without a stated reason (see architectural invariants: prefer open standards).'
assumptions:
    - The existing Requirements-stage interview flow (grill-with-docs style) is the primary consumer; scope should start there rather than trying to cover every future interview-shaped interaction up front.
    - Free text is always available alongside rendered options, even when options + a recommendation are present; the recommendation is pre-selected/highlighted but never auto-submitted, and the user can pick a different option, pick the recommendation, or ignore all options and type a custom answer.
    - Each ask_question call is single-select only — one option (or free text) chosen per call; multi-select is out of scope, since the interview discipline this replaces is explicitly one question/one decision per turn, and combined answers belong in free text or as separate follow-up questions.
    - 'The `options` field is always required (minimum length 1), and the recommended option is always one of the listed options — never a separate free-text-only recommendation mode. This keeps the schema uniform: no conditional ''sometimes chips, sometimes just a textbox'' rendering path.'
    - When the user selects an option (clicked or typed to match), the option's label round-trips as plain text through the existing sendMessage/postStageMessage path, indistinguishable from a typed answer — no new tool-result protocol or structured transcript event. This mirrors the existing precedent (e.g. handleRequestChanges) of turning a UI action into a plain user message via the existing send path, and matches how tool calls are already flattened to prose for replay (conversationHistoryToChatMessages). Re-evaluating this plain-textification (e.g. to preserve 'clicked vs typed' provenance) is explicitly deferred, not ruled out.
    - The question's text stays in normal assistant prose in the same message, not in a schema field; the ask_question tool call itself carries only the structured choice data — options, recommended_option_id, and a short reason for the recommendation. This avoids the model writing the question twice with no single source of truth, and fits the existing rendering precedent where DisplayMessage already shows content and toolCallName together in the same bubble.
    - This ships as this Task's own implementation plan once it reaches the llm-workbench workflow's `planning` stage (task.yaml -> plan.yaml), not as a separate milestone doc — Milestones 8/8a/8b/9 are all already shipped and there is no in-flight milestone to fold this into, and the Task lifecycle itself (requirements -> planning -> implementation -> review -> pr_review -> merged) is the mechanism for scoping the implementation plan going forward.
success_criteria:
    - A concrete design exists for the ask_question tool's schema (options, recommendation, free-text fallback) and how the frontend renders the options/recommendation and collects the answer (including the recommendation's plain sendMessage round-trip).
    - The implementation is scoped as this Task's own plan, produced via the llm-workbench Task workflow's `planning` stage, rather than as a separate milestone document.
