notes: |-
    Automated checks: Go `internal/api` full pass, frontend 186/186, tsc+lint clean. (`cmd/server`/`internal/web` failures are pre-existing missing-`dist` environment artifacts, unrelated to this diff.)

    Schema validation (agent_executable step) confirmed by hand: options minItems 1 ✓, recommended_option_id required ✓, no question-text field in the schema ✓. "Recommended option must reference a listed option" is enforced as a documented/soft constraint rather than JSON-Schema-level (draco can't express cross-field refs cleanly here); frontend degrades gracefully if violated, and this is covered by tests.

    Test-meaningfulness pass: no vacuous tests found. Frontend tests exercise the real rendering/interaction path — render `ask_question` tool-call payloads through the actual `StageConversationPanel`, assert the recommended option gets the highlight class and non-recommended options don't, assert free text stays present/enabled alongside rendered options, and assert clicking an option calls `postStageMessage` with the plain label text (not an id/object) — the same call shape a manually typed message would produce, matching the plain-textification round-trip the design calls for.

    Human-judgment verification step (live Requirements-stage GrillMe interview: visual chip rendering, pre-highlighted recommendation, free text usable, click vs type both producing indistinguishable plain messages) was **not performed** — current worktree/session setup has no live LM Studio/Claude session wired up to drive a real interview, making this impractical right now. The component-level render/click tests above stand in as a proxy: they exercise the same rendering and send-path code, but not true end-to-end model behavior (does GrillMe naturally choose to call `ask_question` with sensible content) or actual visual appearance. Human explicitly accepted this as a residual risk rather than a blocker, to be confirmed opportunistically in real use.

    Design/spec conformance: matches the stated constraints — options-array-only schema (no separate free-text-recommendation mode), question text stays in assistant prose rather than a schema field, recommendation round-trips as a plain sendMessage rather than a new tool-result protocol, single-select only, no new runtime dependency introduced.
