id: nav-url-page-state
title: Reflect the selected nav tab in the URL

project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-23T00:00:00Z
updated_at: 2026-07-23T00:00:00Z

objective: >-
  App.tsx (frontend/src/App.tsx) tracks the selected top-level tab
  ('projects' | 'chat') as plain useState with no URL involvement, so a page
  refresh (or a shared/bookmarked link) always lands back on the 'projects'
  tab regardless of where the user actually was. This task exposes the
  current tab (and, if practical in the same pass, any nested page-level
  selection such as the active project or task within ProjectsPanel) in the
  nav URL, so a refresh preserves the user's place in the UI.

constraints:
  - "No new routing dependency (e.g. react-router) without a stated reason — the project currently has none, and the tab set is small enough that a hand-rolled URL <-> state sync may suffice."
  - "Browser back/forward should behave sensibly once the URL is wired to nav state (at minimum, not actively broken)."
  - "Direct navigation to a URL for a tab/page that no longer exists or is invalid must fall back gracefully to the default tab rather than crashing."

assumptions:
  - "Open question: whether this task covers only the top-level 'projects'/'chat' tab, or also nested selection state (selected project, selected task) inside ProjectsPanel — scope should be pinned down during requirements/planning rather than assumed here."
  - "Open question: URL shape — query param (e.g. ?tab=chat) vs path segment (e.g. /chat) — not yet decided."

success_criteria:
  - "Switching tabs updates the URL, and reloading the page on a given URL restores the same tab that was selected before the reload."
  - "Sharing/bookmarking a URL for a specific tab (and nested selection, if in scope) opens directly to that view."

references:
  knowledge: []
  repo:
    - frontend/src/App.tsx
    - frontend/src/ProjectsPanel.tsx
