id: nav-url-page-state
title: Reflect the selected nav tab in the URL
project: llm-workbench
status: draft
stage: review
created_at: 2026-07-23T00:00:00Z
updated_at: 2026-07-24T14:10:49.4026986Z
objective: Wire browser URL to nav state in the LLM Workbench frontend, so the top-level tab (projects/chat) and, within the Projects tab, the selected project and selected task are all reflected in the URL path — reloading, bookmarking, or sharing a URL restores the same view.
constraints:
    - 'No new routing dependency (e.g. react-router): implement a small hand-rolled URL <-> state sync (parse location.pathname, drive state, listen to popstate) — the tab/page set is small enough not to justify a library, per project architectural invariants preferring open standards / minimal dependencies.'
    - 'Browser back/forward must behave sensibly: pushState on every user-driven navigation (tab switch, project select, task select) so each becomes a back-button stop in visited order; replaceState only for the silent-fallback correction (never for user-driven navigation), so a corrected URL doesn''t create a bogus back-button entry.'
    - 'Direct navigation to a URL for a tab/project/task that doesn''t exist or is invalid must fall back gracefully rather than crash: silently collapse to the nearest valid ancestor in the hierarchy (invalid task -> project view if project is valid, else -> /projects; invalid project -> /projects with list shown, nothing selected), using replaceState for that corrective rewrite.'
    - 'No backend changes required or expected: the Go server''s SPA fallback (internal/api/frontend.go) already serves index.html for any unmatched GET path in production, and Vite dev server''s appType: ''spa'' does the same locally, so all four path shapes resolve without server changes.'
    - Follow docs/engineering conventions.md for implementation choices (existing project convention).
assumptions:
    - 'Scope is full depth: top-level tab (projects/chat), selected project within ProjectsPanel, and selected task within ProjectDetailPanel are all URL-synced. The list/kanban taskView toggle in ProjectDetailPanel stays as transient, non-URL component state.'
    - 'URL shape is path segments, not query params: /chat, /projects, /projects/:projectId, /projects/:projectId/tasks/:taskId — mirroring the backend''s existing REST resource nesting (GET /api/v1/projects/{id}, GET /api/v1/projects/{projectId}/tasks/{taskId}).'
    - On load/refresh, a URL carrying a projectId and/or taskId triggers a fetch-by-id (using the existing, currently-unused GET /api/v1/projects/{id} endpoint, and the existing GET /api/v1/projects/{projectId}/tasks/{taskId} endpoint) to resolve the full Project/Task objects that App/ProjectsPanel/ProjectDetailPanel currently hold in state — no new backend endpoints needed.
    - A 404 (or otherwise invalid) response when resolving projectId or taskId from the URL is treated the same as 'doesn't exist' for fallback purposes — collapse to the nearest valid ancestor, no error toast or dedicated not-found UI.
success_criteria:
    - Switching the top-level tab (projects <-> chat) updates the URL to /projects or /chat, and reloading on either URL restores that tab.
    - Selecting a project within the Projects tab updates the URL to /projects/:projectId, and reloading on that URL re-fetches and restores the same selected project.
    - Selecting a task within a project updates the URL to /projects/:projectId/tasks/:taskId, and reloading on that URL re-fetches and restores the same selected project and task.
    - A bookmarked/shared URL at any of the four levels opens directly to that view on first load (not just on client-side navigation).
    - Using browser back/forward moves through previously visited tab/project/task states in the order the user actually navigated them, without getting stuck or re-showing a stale/dead URL.
    - Loading a URL with a nonexistent or invalid :projectId or :taskId does not crash or show a broken view; it silently lands on the nearest valid ancestor (project list, or the parent project view) and rewrites the URL via replaceState to match what's actually shown.
