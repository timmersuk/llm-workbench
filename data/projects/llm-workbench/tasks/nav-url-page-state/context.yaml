summary: App.tsx currently tracks the selected tab ('projects'/'chat') as plain useState, with no URL involvement, and ProjectsPanel/ProjectDetailPanel similarly hold selectedProject/selectedTask as in-memory state only. This means a page refresh always resets to the 'projects' tab with nothing selected, and there's no way to bookmark or share a link to a specific tab, project, or task. This task adds a hand-rolled URL <-> state sync covering all three levels (tab, project, task) using path-segment URLs (/chat, /projects, /projects/:projectId, /projects/:projectId/tasks/:taskId), backed by the project's existing (already-implemented, currently frontend-unused) fetch-by-id endpoints, with pushState for user-driven navigation and replaceState reserved for silent fallback when a URL references a deleted/invalid project or task.
background: 'Requirements were resolved interactively across four decision points, in order: (1) scope — user chose full depth (tab + project + task) over tab-only, since the backend already exposes the needed fetch-by-id endpoints and project/task drill-down is the most bookmark-worthy path; (2) URL shape — user chose path segments over query params, mirroring the backend''s REST nesting, after confirming the Go server''s existing SPA fallback (internal/api/frontend.go) already serves index.html for any unmatched path so no server change is needed; (3) fallback behavior for invalid IDs — user chose silent collapse to the nearest valid ancestor over showing an explicit not-found message, to avoid new UI surface for a low-frequency edge case; (4) history semantics — user accepted the recommendation of pushState for user-driven navigation and replaceState only for the fallback correction, matching ordinary web-app back-button expectations.'
files:
    - frontend/src/App.tsx
    - frontend/src/components/ProjectsPanel.tsx (or equivalent path, per prior exploration)
    - frontend/src/components/ProjectDetailPanel.tsx (or equivalent path, per prior exploration)
    - internal/api/frontend.go
    - docs/engineering conventions.md
detail: ""
verification:
    - description: Manually load /chat, /projects, /projects/:validId, and /projects/:validId/tasks/:validId directly (simulating a fresh page load / bookmark), and confirm each restores the corresponding tab/project/task view.
      kind: human_judgment
    - description: Manually load /projects/:invalidId and /projects/:validId/tasks/:invalidId, and confirm the app falls back silently (no crash, no error UI) to the nearest valid ancestor and the URL is rewritten accordingly.
      kind: human_judgment
    - description: Click through tab -> project -> task, then use browser back/forward repeatedly, and confirm each step retraces the visited states in order without dead ends or stale views.
      kind: human_judgment
    - description: Automated/unit-level check (if test infra supports it) that switching tab/project/task calls pushState and that the fallback-correction path calls replaceState rather than pushState.
      kind: agent_executable
