approach: |-
    Add a small hand-rolled URL↔state sync layer (no routing library) so the browser URL mirrors nav state at three levels: top-level tab, selected project, and selected task.

    A new pure module `frontend/src/url.ts` defines a `Route` type (`{ tab: 'projects' | 'chat'; projectId?: string; taskId?: string }`) with `parsePath(pathname): Route` and `routeToPath(route): string`. `App.tsx` becomes the single owner of navigation history: it parses `location.pathname` on mount, listens for `popstate`, holds `route` state, and is the only place that calls `pushState`/`replaceState`.

    Selection state is lifted from internal `useState<Project|null>` / `useState<Task|null>` in `ProjectsPanel`/`ProjectDetailPanel` to controlled `selectedProjectId?` / `selectedTaskId?` props driven by `App`. Each panel keeps its existing self-contained fetch/loading/error convention: it resolves the incoming id against its already-loaded list first (no network call on a normal click), falling back to a new `getProject(id)` / existing `getProjectTask(projectId, id)` API call for the deep-link/reload case.

    Each panel exposes three distinct callbacks up (rather than one overloaded callback), so push-vs-replace is fully determined by which callback fired, with no inference from payload:
    - `onSelectProject(id)` / `onSelectTask(id)` — user click → `App` does `pushState`.
    - `onBackToProjects()` / `onBackToProject()` — user click on existing back affordance → `App` does `pushState`.
    - `onInvalidProject()` / `onInvalidTask()` — URL-driven id failed to resolve (404/error) → `App` does `replaceState` down to the nearest valid ancestor.

    The bare `/` path and any unrecognized path are treated as members of the same fallback family: `parsePath` yields the default `projects` route with nothing selected, and `App` immediately corrects the address bar to `/projects` via `replaceState` on mount if the path didn't already match one of the four canonical shapes. Fallback resolution composes naturally bottom-up: `ProjectDetailPanel` (and task resolution) only mounts once `ProjectsPanel` has a confirmed-valid project, so an invalid task under a valid project lands on `/projects/:projectId`, while an invalid project short-circuits straight to `/projects` before task resolution is ever attempted. No tri-state "resolving" status is stored anywhere — ids are plain `string | undefined`, and each panel's existing loading/error UI covers the resolving gap. The list/kanban `taskView` toggle in `ProjectDetailPanel` stays local, non-URL component state.
steps:
    - 'Add `frontend/src/url.ts`: `Route` type `{ tab: ''projects'' | ''chat''; projectId?: string; taskId?: string }`, `parsePath(pathname): Route` (matches `/chat`, `/projects`, `/projects/:projectId`, `/projects/:projectId/tasks/:taskId`; anything else defaults to `{ tab: ''projects'' }`), and `routeToPath(route): string`. Add co-located `url.test.ts` covering all four shapes plus malformed/unmatched paths.'
    - 'Add `getProject(id): Promise<Project>` wrapper to `frontend/src/api.ts` for the existing `GET /api/v1/projects/{id}` endpoint, following the same thin-wrapper style as `getProjectTask`. Extend `api.test.ts`.'
    - 'Update `App.tsx`: introduce `route` state initialized from `parsePath(location.pathname)` on mount; add a `popstate` listener that re-parses and sets `route`; if the initial path didn''t match a canonical shape, `replaceState` to `routeToPath(route)` immediately. Replace the existing tab-switch handler so it both sets `route.tab` and calls `pushState`. Pass `route.projectId`/`route.tab` and navigation callbacks down to `ProjectsPanel`.'
    - 'Update `ProjectsPanel.tsx`: replace internal `selectedProject` state with a controlled `selectedProjectId?: string` prop. Add a resolution effect keyed on `selectedProjectId`: check the loaded `projects` list first; if not present, call `getProject(id)`; on success surface the resolved project for rendering, on failure call the new `onInvalidProject()` prop. Replace direct selection/back logic with `onSelectProject(id)` (row click) and `onBackToProjects()` (existing back affordance) props. Pass `selectedTaskId` and the task-level callback trio through to `ProjectDetailPanel`. Update `ProjectsPanel.test.tsx` accordingly.'
    - 'Update `ProjectDetailPanel.tsx`: mirror the same pattern for tasks — controlled `selectedTaskId?: string` prop, resolution effect against loaded `tasks` list falling back to `getProjectTask`, `onSelectTask(id)` / `onBackToProject()` / `onInvalidTask()` props replacing internal `selectedTask` state. Leave `taskView` (list/kanban) as local state, untouched. Update `ProjectDetailPanel.test.tsx`.'
    - Wire the `onInvalidProject`/`onInvalidTask` callbacks in `App.tsx` to `replaceState` down to `/projects` or `/projects/:projectId` respectively and update `route` state to match. Wire `onSelectProject`/`onSelectTask`/`onBackToProjects`/`onBackToProject` to `pushState` with the corresponding `routeToPath` result plus updated `route` state.
    - 'Update/add tests in `App.test.tsx` covering: initial load restoring each of the four URL shapes (including a deep-link project/task fetch-by-id mock); popstate-driven back/forward updating rendered view; invalid project id and invalid task id triggering replaceState fallback to the correct ancestor; `/` and unrecognized paths collapsing to `/projects` via replaceState; push happening (not replace) on user-driven tab/project/task selection and back-navigation clicks.'
    - Run the full frontend test suite and lint/typecheck per `docs/engineering conventions.md` to confirm no regressions.
risks:
    - jsdom's `window.location`/`history` handling in tests can be finicky (e.g. needing `window.history.pushState` + manual `popstate` dispatch, or resetting location between tests) — test setup may need a small shared helper to avoid flaky/leaking state across test files.
    - Bottom-up fallback composition (task resolution only starting after project resolution succeeds) relies on effect ordering/mount sequencing between ProjectsPanel and ProjectDetailPanel; a race where both ids resolve/fail concurrently could cause a double replaceState (e.g. replace to /projects then immediately replace again) — needs care to ensure only one corrective replaceState fires per invalid-URL load.
    - Lifting selection state to controlled props changes the public interface of ProjectsPanel/ProjectDetailPanel; any other current callers/tests relying on the old uncontrolled internal-state API will need updating in the same change to avoid breaking the build.
    - Existing 'back to projects' / 'back' UI affordances must be re-audited to ensure they now call onBackToProjects/onBackToProject (push) rather than being accidentally left calling nothing or double-firing onSelectProject(null)-style logic from the old implementation.
