    - human_judgment (4 canonical URLs load correct view on fresh load): confirmed by human against live dev server + real data (demo-project/build-skeleton).
    - human_judgment (invalid project id / invalid task id fall back silently with URL rewrite): confirmed by human.
    - human_judgment (back/forward retraces tab->project->task navigation in order, no dead ends): confirmed by human.

    Human's verbatim confirmation: "all as expected. excellent." All success criteria and constraints satisfied; no blocking findings.
