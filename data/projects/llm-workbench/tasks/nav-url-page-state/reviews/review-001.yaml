    Phase 2 (test-meaningfulness): Reviewed url.test.ts, App.test.tsx, ProjectsPanel.test.tsx, ProjectDetailPanel.test.tsx in full. Assertions check exact pushState/replaceState call args, distinguish list-resolution vs. fetch-fallback paths via explicit call/no-call expectations, and popstate tests verify the app reacts to a browser-driven pathname change without itself re-invoking pushState/replaceState. No vacuous or mis-targeted tests found.

