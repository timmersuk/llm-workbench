notes: |-
    Phase 1 (automated): 235/235 tests pass, lint (oxlint) clean, tsc+vite build clean. No new dependency added (hand-rolled url.ts, no react-router) — satisfies the constraint. No Go/backend files touched, consistent with "no backend changes" assumption; existing GET /api/v1/projects/{id} and GET /api/v1/projects/{projectId}/tasks/{taskId} endpoints used as-is.

