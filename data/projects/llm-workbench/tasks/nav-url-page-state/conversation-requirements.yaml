        Good — silent fallback to the nearest valid ancestor it is.

        **Question 4 — Push vs. replace on browser history**

        For back/forward to "behave sensibly" (per the constraint), I need to decide when navigation writes a new history entry (`pushState`, making it back-button-reachable) vs. silently rewrites the current one (`replaceState`, no back-button entry).

        My recommendation:
        - **`pushState`** for user-driven navigation: switching tabs, selecting a project, selecting a task. Each becomes a back-button stop, e.g. task → project → projects list → chat, in the order the user actually visited them.
        - **`replaceState`** only for the *corrective* rewrite when an invalid/stale URL falls back to an ancestor (Q3's case) — so landing on `/projects` after `/projects/999` (deleted) doesn't leave the dead `/projects/999` sitting in history for back to bounce into.

        Reason: this matches ordinary web-app behavior users already expect (back = "where I was before"), and keeps the one silent-fallback case from creating a broken back-button loop.

        Do you want push-for-navigation / replace-for-fallback-correction, or would you prefer something simpler (e.g. replaceState everywhere, so tab/selection changes don't affect back/forward at all)?
