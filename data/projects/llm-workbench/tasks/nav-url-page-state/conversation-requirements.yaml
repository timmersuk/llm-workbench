        **Question 3 — Fallback behavior for an invalid/missing project or task ID**

        My recommendation: if `/projects/:projectId` (or the task variant) is loaded and the fetch-by-id returns 404, fall back silently to the parent level in the URL hierarchy — task ID invalid → drop to the project view (`/projects/:projectId`) if the project itself is valid, or all the way to `/projects` if not; project ID invalid → `/projects` with the list shown and nothing selected. No error toast/banner, just land on the nearest valid ancestor. Reason: this matches the constraint ("fall back gracefully... rather than crashing") with the least new UI surface — no need to design a new error-state component for a low-frequency edge case (stale bookmark, deleted project), and silently landing one level up is the least surprising behavior for a user who followed a stale link.

        Do you want silent fallback to the nearest valid ancestor, or would you prefer an explicit "not found" message before returning to the list?
