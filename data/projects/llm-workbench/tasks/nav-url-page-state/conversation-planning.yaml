      content: |-
        Yes — I'll go with your recommendation: `App` owns URL parsing/popstate and drives resolution/fallback, panels keep their existing loading/error UI while resolving, and report `null` on failure so `App` can `replaceState` down a level.

        Next question: **when a user clicks to select a project or task that's already loaded (the common, non-URL-driven case), who actually calls `pushState` — does the panel call the `onSelectProject`/`onSelectTask` callback purely to update React state, with `App` doing the `pushState` as a side effect of that state changing, or does the callback itself synchronously perform the `pushState`?**

        My recommended default: the callback prop (`onSelectProject`, `onSelectTask`) passed down from `App` does both — updates `App`'s route state *and* calls `pushState` synchronously in the same function, rather than `App` reacting to a state change via `useEffect` to decide whether to push.

        Reason: an effect-based approach would need to distinguish "state changed because of user click (push)" from "state changed because of popstate/fallback (don't push, or replace instead)" — that's exactly the kind of ambiguity that causes bugs (double-pushes, or missed pushes) in hand-rolled routers. Making the callback itself the single call site for "this is a user-driven navigation" keeps the push-vs-replace decision explicit and co-located with the action that caused it, matching the constraint that pushState should happen "on every user-driven navigation."

        Does that match your intent, or would you rather centralize through a state-diffing effect in `App`?
