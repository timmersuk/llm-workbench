        **Question: what should happen at the bare root path `/` (and any other unrecognized path) on initial load?**

        My recommended default: treat `/` (and anything that doesn't match one of the four known shapes) exactly like an invalid id — parse it as "no route matched," default in-memory state to the `projects` tab with nothing selected, and immediately correct the visible URL to `/projects` via `replaceState` (not `pushState`), so the address bar never sits on a URL that doesn't correspond to any real state.

        Reason: this reuses the exact same "collapse to nearest valid ancestor via replaceState" rule already agreed for invalid project/task ids, rather than inventing a separate "default route" concept — `/` just becomes another member of the same fallback family (nearest valid ancestor of nothing-recognized is the top-level projects list).

        Does that match your intent, or would you rather leave `/` alone (no rewrite) and just render the projects tab in-memory without touching the URL?
