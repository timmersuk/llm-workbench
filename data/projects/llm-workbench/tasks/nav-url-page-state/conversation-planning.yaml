        Good — confirms `GET /api/v1/projects/{id}` exists server-side but has no frontend `api.ts` wrapper yet (only `getProjectTask` exists for tasks). Now I have enough grounding to start the interview.

        I have a good picture of the code: `App.tsx` holds `tab` state and renders `ProjectsPanel`/`ChatPanel`; `ProjectsPanel` holds `selectedProject` (a full `Project` object, not just an id) and renders `ProjectDetailPanel`; `ProjectDetailPanel` holds `selectedTask` similarly. There's no `getProject(id)` wrapper in `api.ts` yet (needed for the URL-load-by-id case), though the backend endpoint exists.

        **First question: where should the URL-parsing/sync logic live?**

        My recommended default: a single new module `frontend/src/url.ts` holding pure functions (`parsePath(pathname) -> Route`, `routeToPath(route) -> string`) plus a small `useUrlRoute()`-style hook (or just inline `useEffect`/`popstate` wiring in `App.tsx`) that owns navigation — rather than scattering `pushState` calls across `App`/`ProjectsPanel`/`ProjectDetailPanel` individually.

        Reason: the three levels of state (tab, project, task) currently live in three different components' local `useState`, but the URL is one single source of truth spanning all three — centralizing the parse/serialize logic in one small pure module keeps `pushState`/`replaceState` calls consistent and testable (matches the "thin wrapper, one function per concern" style already used for `api.ts`), while the actual `useState`s can stay where they are and just get lifted/driven from `App`.

        Does that match your intent, or would you rather keep the logic more distributed (e.g. each panel manages its own slice of the URL independently)?
