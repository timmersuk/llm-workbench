      content: |-
        I'll go with your recommendation — controlled selection via props, with each panel keeping its own list-fetch/loading/error handling.

        Next question: **how should the fallback resolution (invalid projectId/taskId) actually be triggered and sequenced, given that resolution is now async (a network call)?**

        My recommended default:
        - On mount (and whenever the URL changes via popstate), `App` parses the path into `{tab, projectId, taskId}` and passes those down as props.
        - `ProjectsPanel` reacts to `selectedProjectId` via `useEffect`: if set and not found in its loaded `projects` list, call `getProject(id)`; on success call `onSelectProject` with the resolved project (or just let App know it resolved), on 404/error call `onSelectProject(null)` — App treats a `null` reported for a URL-driven id as "invalid" and does a `replaceState` down to `/projects`.
        - Same pattern one level down: `ProjectDetailPanel` resolves `selectedTaskId` against loaded `tasks`, falling back to `getProjectTask`, reporting `null` on failure so `App` replaceState's down to `/projects/:projectId`.
        - While resolution is in-flight, the panel shows its existing loading state (no special "resolving URL" UI needed).

        Reason: this reuses each panel's existing self-contained loading/error-state convention instead of inventing a new "URL resolution" concept, and keeps the invalid→fallback rewrite logic in one place (App), consistent with App owning all `pushState`/`replaceState` calls.

        Does that match your intent, or would you prefer the fallback/validation logic to live inside the panels themselves (each panel calls `history.replaceState` directly when it detects its own id is invalid)?
