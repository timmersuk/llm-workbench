        - `onBackToProjects()` — user clicked "back to projects" → App pushes `/projects`.
        - `onInvalidProject()` — resolution of a URL-driven id 404'd → App replaces down to `/projects`.

        (and the mirrored trio one level down for tasks: `onSelectTask`, `onBackToProject`, `onInvalidTask`).

        This keeps "push vs replace" fully determined by *which prop fired*, with no shared/overloaded callback that has to guess intent from a `null` payload — matching the turn-4 rule that push-vs-replace must be an explicit, unambiguous call site.

