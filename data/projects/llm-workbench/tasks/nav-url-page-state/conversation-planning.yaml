      content: |-
        That helps a lot — the conventions doc confirms "each panel is self-contained: fetch + loading/error/empty states + render" is a deliberate pattern, which argues against centralizing all data-fetching in `App`.

        **Next question: how should selection state be lifted so `App` can drive it from the URL?**

        My recommended default: keep `projects`/`tasks` list-fetching exactly where it is (`ProjectsPanel`/`ProjectDetailPanel` keep their own `useEffect` fetches), but make the *selection* controlled from `App` down:
        - `App` becomes the source of truth for `{ tab, projectId, taskId }` (strings/undefined, parsed from the URL).
        - `ProjectsPanel` takes new props `selectedProjectId?: string` and `onSelectProject: (id: string | null) => void`, replacing its internal `useState<Project|null>`. It resolves `selectedProjectId` to a `Project` by first checking its already-loaded `projects` list (no network call on a normal click), and falling back to a new `getProject(id)` API call when the id isn't in that list yet (the deep-link/reload case) — reporting a resolve failure by calling `onSelectProject(null)` so `App` can fall back to `/projects`.
        - `ProjectDetailPanel` gets the analogous `selectedTaskId?: string` / `onSelectTask` props, resolving against its loaded `tasks` list first, falling back to `getProjectTask` otherwise.
        - `App` passes `onSelectProject`/`onSelectTask` callbacks down (through `ProjectsPanel` to `ProjectDetailPanel` for the task one) that just update `App`'s route state and call `pushState`/`replaceState` per `url.ts`.

        Reason: this keeps each panel's existing fetch-by-list-id logic and self-contained loading/error states untouched (matching the documented convention), adds only the minimal new surface (a `getProject` wrapper, controlled-selection props) needed for the URL to drive things, and avoids duplicating all project/task data into `App` just for routing purposes.

        Does that match your intent, or would you rather fully lift the `Project`/`Task` objects themselves into `App` state (bigger refactor, but a single flatter data-owner)?
