        One more design question before I write the full step list — this one's about the `<Route>` type shape and where "unresolved yet" fits in:

        **Question:** Should `App`'s route state distinguish "no id yet" from "id present but not yet confirmed valid," or can `projectId`/`taskId` just be plain `string | undefined` throughout, with validity only ever expressed indirectly (by whether the panel below currently shows something for that id)?

        My recommended default: keep it as plain `string | undefined` — no separate `'pending' | 'valid' | 'invalid'` status. `App` sets `projectId` from the URL immediately (optimistically); `ProjectsPanel` either finds it in its loaded list, resolves it via `getProject`, or (on failure) calls `onSelectProject(null)`, at which point `App` clears `projectId` and rewrites the URL. There's no intermediate "invalid" state stored anywhere — just "currently set" vs "cleared after a failed resolve."

        Reason: this matches the already-agreed pattern (panels report `null` on failure, `App` reacts) and avoids adding a tri-state enum purely for routing bookkeeping — the loading/error affordance during resolution is already handled by each panel's existing loading state, so `App` itself never needs to know "resolving" as a distinct state.

