          result: "1\t# Engineering Conventions\n2\t\n3\tSmall, consequential implementation choices for the workbench's own codebase\n4\t(Go backend + Vite/React frontend). These are conventions for building the\n5\ttool, not the domain model it manages (see `architectural invariants.md` for\n6\tthat). Add to this file whenever a new cross-cutting choice is made, so it\n7\tdoesn't have to be re-derived or re-litigated later.\n8\t\n9\t## Logging\n10\t\n11\t* Backend logging uses `logrus` (`github.com/sirupsen/logrus`), configured\n12\t  globally in `cmd/server/main.go` via `LOG_LEVEL` and a JSON/text formatter\n13\t  switch.\n14\t* Always use structured logging: attach context via `WithField(key, value)`\n15\t  (one field) or `WithFields(logrus.Fields{...})` (multiple fields, plus\n16\t  `WithError(err)` for an error value), then call `Debug`/`Info`/`Warn`/\n17\t  `Error`/`Panic` with a short, fixed message string. Never use the\n18\t  `printf`-style variants (`Debugf`/`Infof`/`Warnf`/`Errorf`/`Printf`/\n19\t  `Panicf`) — interpolated values belong in fields, not the message, so\n20\t  they're queryable in the JSON log output. See `cmd/server/main.go`'s\n21\t  startup log, `internal/project/store.go`/`internal/task/store.go`'s\n22\t  `List()` skip-warnings, and `internal/api/stage_conversation.go`'s\n23\t  error/warn logs for the pattern to match.\n24\t* Exception: `logrus.Fatalf` is fine as-is. It's only used on unrecoverable\n25\t  startup failures (`utils.MustGetEnv*` in `internal/utils/env.go` and\n26\t  `cmd/server/main.go`'s frontend-mount/listen failures) where the process\n27\t  exits immediately after, so there's no downstream log aggregation benefit\n28\t  to structuring it.\n29\t\n30\t## Configuration\n31\t\n32\t* Env vars are read once, at the top of `main()`, before any component is\n33\t  constructed (`cmd/server/main.go`). Names are `SCREAMING_SNAKE_CASE` with\n34\t  no prefix namespacing (`HTTP_ADDR`, `WORKSPACE_ROOT`, `LOG_LEVEL`,\n35\t  `LLM_BASE_U