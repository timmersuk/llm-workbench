id: execution-usage-lost-on-timeout
title: Report partial token/cost usage when an execution is timed out or canceled
project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-23T00:00:00Z
updated_at: 2026-07-23T00:00:00Z

objective: >-
  ClaudeRunner.Execute and CodexRunner.Execute only populate
  ExecuteOutput.TokensUsed/CostEstimate from the underlying CLI's terminal
  usage message (claude's ResultMessage, TotalCostUSD/Usage —
  internal/agentrunner/claude_runner.go's processExecuteMessage; codex's
  equivalent final event). When the run's context is canceled or its
  deadline expires before that terminal message arrives — e.g. hitting
  AGENT_EXECUTION_TIMEOUT — the receive loop just stops (ReceiveMessages'
  channel closes) and returns whatever ExecuteOutput had accumulated so
  far, which is always TokensUsed: 0 / CostEstimate: 0 regardless of how
  much real, billed work the agent actually did. This was observed
  directly: an execution that failed with "context deadline exceeded"
  after running for the full AGENT_TIMEOUT budget recorded
  tokens_used: 0/cost_estimate: 0 in its execution.yaml, which is
  misleading — it reads as "no work happened" rather than "we stopped
  listening before the agent told us." This task makes that failure mode
  report honestly: either by surfacing whatever partial/incremental usage
  each provider exposes mid-stream (if any), or by explicitly marking
  metrics as unknown/unavailable on a timed-out or canceled execution
  rather than reporting a fabricated zero.

constraints:
  - "Do not fabricate a non-zero estimate from guesswork — either report a real (even if partial) figure the provider exposes, or mark the metric as unavailable/unknown; never synthesize a number."
  - "Applies to both ClaudeRunner and CodexRunner's Execute paths — whatever mechanism is chosen should cover both, not just one executor."
  - "task.ExecutionMetrics' current zero-means-unreported convention (docs/task schema v0.md's execution.yaml.metrics) needs an explicit decision: either it gains a way to distinguish '0 tokens, confirmed' from 'unknown, timed out before we could tell', or the task concludes zero is an acceptable/documented approximation for this case — don't leave the ambiguity unresolved."

assumptions:
  - "Open question: does the claude CLI / codex CLI emit any incremental usage/cost signal before the final result message (e.g. per-turn token counts), or is usage genuinely only known at the very end? This needs checking against both SDKs before deciding whether partial reporting is even possible."
  - "Related but distinct from the AGENT_TIMEOUT vs AGENT_EXECUTION_TIMEOUT split (fixed separately, same investigation) — that fix reduces how often executions get cut off, but doesn't address what gets reported when one still is (a human Stop action, or a genuinely long-running execution that still exceeds even the raised budget, will hit this same path)."

success_criteria:
  - "A canceled/timed-out execution.yaml no longer silently claims tokens_used: 0/cost_estimate: 0 as if that were a measured fact, for both claude-code and codex executors."
  - "The chosen distinction (real partial figure vs. explicit unknown marker) is reflected in task.ExecutionMetrics' shape or documented convention, and in docs/task schema v0.md if the shape changes."

