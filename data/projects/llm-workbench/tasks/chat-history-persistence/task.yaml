id: chat-history-persistence
title: Persist chat conversations to disk so they survive reloads and restarts

project: llm-workbench

stage: requirements

created_at: 2026-07-26T00:00:00Z
updated_at: 2026-07-26T00:00:00Z

objective: >-
  Free-form Chat has no durable storage today: ChatClientRunner.sessions
  (internal/agentrunner/chat_client_runner.go) is an in-memory map lost on
  server restart, and ChatPanel.tsx generates a fresh crypto.randomUUID()
  SessionKey on every mount without ever reading one back — so a page
  reload always starts a brand-new, empty chat, and any conversation not
  still sitting unevicted in server memory is gone for good. This is
  unlike task conversations, which persist every turn to
  conversation-<stage>.yaml under the owning task
  (internal/task/conversation.go) precisely so nothing is lost to a
  restart or reload. Add durable storage for chat so a user's previous
  conversations remain available across reloads and server restarts,
  rather than existing only for the lifetime of one browser tab's
  in-memory session. Two existing tasks touch adjacent ground and should
  be coordinated with rather than duplicated: resumable-chat-streams
  (about an in-progress stream surviving a refresh mid-generation, which
  explicitly asks whether durable persistence like this would solve most
  of its own scope for free) and chat-conversation-parity (about
  reconciling chat's session/history model with task conversations' shape
  more broadly).

constraints:
  - Chat is not scoped to exactly one project the way a task is (docs/task schema v0.md §6), so persisted chat history needs its own storage location and identity scheme rather than assuming it can simply reuse a task's tasks/<id>/ directory.
  - Should be sequenced or merged with chat-conversation-parity so the two don't independently invent two different persisted-history formats for the same feature.
  - Follow docs/engineering conventions.md for implementation choices.
  - "No new runtime dependency without a stated reason (see architectural invariants: prefer open standards)."

assumptions:
  - A user should be able to see and return to a past chat conversation, not just have the current one survive a single reload — this task is about durable multi-conversation history, not only crash recovery of the one in progress.
  - Where chat history is stored on disk (a new top-level directory, per-user files, something else) and how a user browses or selects a past conversation in the frontend are design questions for this task's own requirements/planning stage, not decided here.
  - This task is about completed, at-rest conversation turns; resumable-chat-streams' narrower concern (an in-flight stream surviving a refresh mid-generation) may turn out to be subsumed by this task's design but is treated as a separate task unless requirements determines otherwise.

success_criteria:
  - A user's chat conversations survive a page reload and a server restart, and can be browsed and reopened rather than only continued blind.
  - A decision is recorded on the relationship to resumable-chat-streams (subsumed, sequenced, or independent) and to chat-conversation-parity (shared format or not).
  - Old chat sessions in ChatClientRunner's in-memory map are no longer the only copy of a conversation's history.

references:
  knowledge:
    - docs/task schema v0.md
    - docs/engineering conventions.md
  repo:
    - internal/agentrunner/chat_client_runner.go
    - internal/api/chat.go
    - frontend/src/ChatPanel.tsx
    - internal/task/conversation.go
    - data/projects/llm-workbench/tasks/resumable-chat-streams/task.yaml
    - data/projects/llm-workbench/tasks/chat-conversation-parity/task.yaml
