    - role: assistant
      content: |-
        I've kicked off some research into the repo. While that runs, let me start with the first design-tree branch: scope of "evaluate a pure-Go git library."

        The task explicitly says no in-app git operations are in scope for Milestone 2 — this is about producing a *follow-up milestone plan*, not writing the migration code now. So the core deliverable is a decision document/plan. Before I dig into technical branches (go-git vs shelling out, commit granularity, etc.), I want to pin down the shape of that deliverable.This is exactly the task at hand — a pre-existing requirements draft. Now let's check the remaining docs and milestone-orphans.md, plus project_summary.md, CLAUDE.md, engineering conventions.md.What's the shape of the deliverable this task should actually produce? Given the constraint that in-app git work is out of scope for Milestone 2, and that go-git hasn't been evaluated yet, I see three plausible scopes for "a follow-up milestone plan exists":

        1. **Lightweight decision doc** — research go-git's feasibility against the current on-disk layout, weigh it against just keeping plain files, and land on a recommendation with rationale. No PR breakdown.
        2. **Full milestone plan** in the house style used for Milestone 6/7 — a PR-by-PR breakdown with scope, sequencing, and model/effort assignments, ready to hand straight to implementation later.
        3. **Two-stage** — a short spike/investigation task first (actually prove go-git can do commit-per-write against `data/projects/{id}/tasks/{id}/task.yaml`), and only write the full milestone plan once that spike reports back.

        I'd lean toward **option 3**: the constraint explicitly flags that go-git "hasn't been evaluated yet," and success criteria only require a *plan* to exist — not a finished evaluation. A cheap spike de-risks the plan's central technical claim (can go-git actually do this cleanly) before committing effort to a detailed PR breakdown that might turn out to be moot.

        Which of these matches what you want?
