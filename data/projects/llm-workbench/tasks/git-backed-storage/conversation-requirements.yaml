        Next fork — the one your own earlier framing flagged as open: **when the periodic background worker tries to pull remote changes and finds the remote has diverged from local** (e.g. someone edited a task.yaml directly in the remote repo, or another server instance pushed first), how should that be resolved?

        1. **Fail loud**: pull detects divergence, sync worker logs/surfaces an error and pauses pushing further local commits until an operator intervenes manually (e.g. via `git` outside the app). No automatic merge logic needed. Safest against silent data loss, but requires manual recovery when it happens.
        2. **Last-write-wins**: whichever side is newer (by timestamp) overwrites the other — either force-push local over remote, or force-pull remote over local. Simple, fully automatic, but can silently discard real changes.
        3. **Attempt merge, fail loud on real conflict**: try a normal git merge (works fine when changes touch different task/project files, which is the common case since each task/project lives in its own file); only surface an error if the same file was changed on both sides.

