artup config: main.go refuses to start without it. FileStore survives only as a test fixture — never reachable in production.","DATA_REPO_URL is treated strictly as a local filesystem path for this milestone — no network transport, no auth. Remote hosting/credentials are explicitly punted to a future milestone.","Migration of any pre-existing populated WORKSPACE_ROOT, and untangling this repo''s own data/ folder from the main code repo''s git tracking, are both out of scope — manual/deployment concerns handled outside this milestone''s PRs.","Follow docs/engineering conventions.md for implementation choices; no new runtime dependency without a stated reason."],"context":{"background":"docs/project_summary.md and CLAUDE.md originally described git-backed persistence for tasks/projects; Milestone 2 walked this back to a plain-file FileStore using os.ReadFile/os.WriteFile directly against WORKSPACE_ROOT, with no version history. This task restores the git-backed design: a GitStore built on go-git (pure-Go, avoiding a hard git-binary runtime dependency) that treats DATA_REPO_URL as a local-filesystem-only remote for now (no network auth — deferred to a future milestone), clones/resumes into WORKSPACE_ROOT at startup, commits synchronously on every write under a single process-wide mutex, and pushes asynchronously via a background worker with indefinite retry-without-backoff on failure and no auto-resolution of non-fast-forward rejections. The store shape changes from a per-project-root factory to a single process-wide singleton with an explicit projectID parameter on the Store interfaces, and FileStore is refactored to match so both stores share one interface. No in-app history/diff/blame browsing UI or API, and no migration tooling for existing populated WORKSPACE_ROOTs (including this repo''s own data/ folder), are in scope — both explicitly deferred. Testing keeps Go unit/integration tests constructing Store values directly (bypassing main.go), while the e2e harness 