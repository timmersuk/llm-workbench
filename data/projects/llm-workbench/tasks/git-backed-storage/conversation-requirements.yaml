      content: |-
        That last answer resolves the e2e gap: the harness's temp-`WORKSPACE_ROOT` setup step also runs `git init --bare` into a second temp dir and exports `DATA_REPO_URL` before launching the `main.go` subprocess — same local-path, no-auth model, applied at process-boot.

        Stepping back to check the whole tree for coherence, here's everything locked in so far:

        1. **Deliverable**: this task builds `GitStore` for real (not just a decision doc). This requirements interview fixes the design; a PR-by-PR milestone plan gets written in this same task's later planning stage.
        2. **Activation**: `DATA_REPO_URL` is mandatory — `main.go` refuses to start without it. `FileStore` survives only as a test fixture, never reachable in production.
        3. **Remote model**: `DATA_REPO_URL` is treated as a local filesystem path — no network auth of any kind. Real remote hosting/credentials are explicitly punted to a future milestone.
        4. **Startup**: clone into `WORKSPACE_ROOT` if it's empty; if non-empty, resume if it's already a matching clone, else error (ambiguous state).
        5. **Sync model**: every Create/Update commits locally, synchronously, on every write. A background worker periodically pushes accumulated commits — it never pulls after startup. Push failures are logged and retried next interval forever, no backoff/alerting. Non-fast-forward rejections are a documented limitation, not auto-resolved (no merge/rebase logic) — manual operator reconciliation required.
        6. **Store shape**: one singleton store instance process-wide (the `TaskStoreFactory` per-project-root pattern goes away); `api.TaskStore`/`task.Store` interfaces gain an explicit `projectID` param; a single process-wide mutex guards commits. Applied uniformly, so `FileStore` is refactored to the same interface too (~150 test call sites touched).
        7. **Git library**: `go-git`, committed to upfront — no separate evaluation/spike gate.
        8. **Surface**: storage-layer swap only. No new API/UI for browsing history/diff/blame — that's deferred to a later milestone.
        9. **Migration**: out of scope for both (a) any pre-existing populated `WORKSPACE_ROOT` in general, and (b) this repo's own `data/` folder specifically (untangling it from the main code repo's git tracking) — both are manual/deployment concerns outside this milestone's PRs.
        10. **Testing**: Go unit/integration tests bypass `main.go` entirely, constructing `Store` values directly. The e2e harness (which must boot the real binary) provisions its own `git init --bare` temp remote and exports `DATA_REPO_URL` before launching the subprocess.

        I don't see a remaining open fork in the design — the objective, constraints (including the original "no in-app git operations" constraint being explicitly superseded by your correction), and success criteria all now read as one coherent picture to me.

        Does this fully capture what you want, or is there anything you'd add, change, or want me to dig into further before I lock this in as the finalized requirements?
