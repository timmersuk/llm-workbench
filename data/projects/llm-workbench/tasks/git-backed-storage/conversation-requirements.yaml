        Now the next fork, which you flagged as open in your correction: **how does local-write sync to the remote happen** — synchronously inline with each write, or via a background worker?

        Two shapes, with real tradeoffs:

        1. **Synchronous commit+push on every write**: `GitStore.Save()` writes the file, `git commit`, `git push` — all before the write call returns. Simple mental model (a caller's write is durable-to-remote by the time they get a response), but it makes every task/project save latency-bound on a network round-trip to the remote, and a flaky/offline remote turns routine saves into errors.
        2. **Background worker with periodic flush**: writes land on the local clone immediately (fast, always succeeds locally); a goroutine periodically batches uncommitted changes into a commit and pushes, and separately pulls remote changes on its own interval. Saves stay fast and offline-tolerant, but there's a window where a "saved" task hasn't reached the remote yet, and you need to define what a crash-before-flush means (lost commits that were local-only) and how pull-conflicts get resolved (last-write-wins? merge? fail loud?).

        Given this task's own note ("either commit/push happens on update, or potentially the server keeps a worker goroutine... periodically") you're clearly weighing both. Which do you want as the design, or do you want me to lay out the conflict-handling implications of each before you decide?Which sync model do you want — synchronous commit+push, a fully backgrounded worker (async commit and push both), or the hybrid (commit locally per-write, push/pull periodically in the background)?
