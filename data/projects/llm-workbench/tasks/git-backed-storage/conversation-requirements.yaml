        That confirms it: `taskStores` is a factory — a fresh `task.Store` gets constructed per project root on each call (`internal/api/router.go`'s handlers call `taskStores(root)` per-request), and `projectStore` is a separate singleton. If `GitStore` backs *all* of these with one shared git repository at `WORKSPACE_ROOT` (per the "one repo rooted at data/" model already implied), then concurrent HTTP requests — e.g. two different tasks in two different projects being updated at the same moment — would each spin up their own `GitStore` instance but still be committing into the *same* underlying repo (same `.git`, same `HEAD`, same index) at the same time. `go-git`'s repository/worktree operations aren't safe for concurrent commits the way independent `os.WriteFile` calls to different paths already are, so this is a real gap the current no-locking `FileStore` doesn't have to deal with.

