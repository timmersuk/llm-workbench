      created_at: 2026-07-24T17:11:42.2178808Z
    - role: assistant
      content: |-
        Good catch — that reflects a real problem in the current shape: `taskStores` is a factory closure that constructs a brand-new `*task.FileStore` on every single HTTP request (`internal/api/router.go` calls `taskStores(root)` per-request, and it's cheap today because `FileStore` is just a `{Root string}` struct with no state). For a `GitStore`, doing the naive equivalent — constructing a fresh `GitStore` per request, each independently wrapping the same `.git` — would be exactly the "load of individually forked instances" problem you're flagging, and it's what made the shared-lock question from last turn awkward in the first place (I had to invent a `*GitRepo` handle to inject *into* each forked instance just to give them something to share).

        Your proposed fix — one underlying store instance (a singleton, constructed once in `main.go`) that all task/project operations call back into, rather than one instance per project root — is cleaner. But it has a real fork depending on how far it goes, since `ProjectStore` is already a true singleton today while `TaskStore` is per-project-root via `TaskStoreFactory` (`func(root string) api.TaskStore`), and the `api.TaskStore`/`task.Store` interface methods (`Get(id)`, `Create(t)`, etc.) currently take no project identifier at all — the project scoping is baked into *which* instance you're holding, not into the method signature.

        So: should this consolidation change the **interface itself** (e.g. `Get(projectID, taskID)` instead of a project-rooted instance's `Get(taskID)`), applied uniformly so `FileStore` is refactored to match too — or should the interface signatures stay exactly as they are today (still "one project's worth of tasks, addressed by task id"), and only the *construction* changes so that under the hood every per-project facade shares one singleton `GitRepo`/lock instead of independently opening the repo?I've asked the question above — let me know which option you'd like (or suggest a different split).
