summary: Migrate task/project persistence from the plain-file FileStore to a git-backed GitStore using go-git, restoring the originally-intended "git-backed" architecture with a commit per create/update and full history/diff/blame available in the underlying repo (though not yet surfaced in any UI/API).
background: 'docs/project_summary.md and CLAUDE.md originally described git-backed persistence for tasks/projects; Milestone 2 walked this back to a plain-file FileStore using os.ReadFile/os.WriteFile directly against WORKSPACE_ROOT, with no version history. This task restores the git-backed design: a GitStore built on go-git (pure-Go, avoiding a hard git-binary runtime dependency) that treats DATA_REPO_URL as a local-filesystem-only remote for now (no network auth — deferred to a future milestone), clones/resumes into WORKSPACE_ROOT at startup, commits synchronously on every write under a single process-wide mutex, and pushes asynchronously via a background worker with indefinite retry-without-backoff on failure and no auto-resolution of non-fast-forward rejections. The store shape changes from a per-project-root factory to a single process-wide singleton with an explicit projectID parameter on the Store interfaces, and FileStore is refactored to match so both stores share one interface. No in-app history/diff/blame browsing UI or API, and no migration tooling for existing populated WORKSPACE_ROOTs (including this repo''s own data/ folder), are in scope — both explicitly deferred. Testing keeps Go unit/integration tests constructing Store values directly (bypassing main.go), while the e2e harness — which boots the real binary — grows its own git init --bare temp-remote provisioning and DATA_REPO_URL export before launching the subprocess, mirroring the same local-path/no-auth model at process-boot instead of Go-test level.'
