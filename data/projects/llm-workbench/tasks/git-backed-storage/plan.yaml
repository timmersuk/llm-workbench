approach: Deliver the entire GitStore feature as a single task, ending in one PR/one review/one approval — no milestone doc, no stub sibling tasks. Implement in dependency order (interface refactor → FileStore refactor → GitStore core → sync commits → push worker → main.go wiring → design note → docs/tests), landing as one commit per step within the same PR/branch, with each commit left in a working, buildable state so the PR review can walk the sequence step-by-step. This restores the "git-backed storage" framing from before Milestone 2 by replacing FileStore-in-production with a go-git-backed GitStore, while keeping FileStore alive only as a test fixture.
steps:
    - 'Commit 1: Collapse TaskStoreFactory''s per-project-root singleton-per-project pattern into one process-wide singleton store; add an explicit projectID parameter to the task.Store and api.TaskStore interfaces.'
    - 'Commit 2: Refactor FileStore onto the new singleton + projectID-param interface shape; update the ~150 existing test call sites accordingly so FileStore remains usable as a test fixture. (Repo builds and all tests pass at this checkpoint, pre-GitStore.)'
    - 'Commit 3: Implement GitStore (go-git, pure-Go — added to go.mod with go-git''s role as the stated reason) satisfying the refactored interfaces: startup logic clones into an empty WORKSPACE_ROOT, resumes if WORKSPACE_ROOT is already a matching clone, and errors on ambiguous non-empty/non-matching state.'
    - 'Commit 4: Implement synchronous local commits: every Create/Update on GitStore commits locally immediately, serialized by a single process-wide mutex.'
    - 'Commit 5: Implement the background push worker: a periodic goroutine pushes accumulated local commits to DATA_REPO_URL, never pulls after startup, logs and retries indefinitely on push failure, and treats non-fast-forward rejections as a documented manual-reconciliation limitation (no auto merge/rebase).'
    - 'Commit 6: Wire GitStore into main.go: DATA_REPO_URL becomes mandatory at startup (fail fast if unset), production path constructs GitStore, FileStore is no longer reachable in production.'
    - 'Commit 7: Add a design note (doc comment near main.go or short doc under docs/) specifying the subprocess-boot provisioning pattern (git init --bare temp remote + exported DATA_REPO_URL) that a future e2e-tests task''s harness must follow — explicitly not verified by this task.'
    - 'Commit 8: Update docs/project_summary.md and CLAUDE.md framing to reflect that storage is git-backed again (undoing the Milestone 2 walk-back), and run/update the existing test suite for the refactored interfaces and new GitStore behavior.'
risks:
    - 'Large single PR: even with per-step commits, one review/one approval covers a mechanical ~150-call-site refactor, a new storage engine, a concurrency-sensitive push worker, and main.go wiring together, with no intermediate merged checkpoint.'
    - Single process-wide write mutex serializes all commits across all projects — accepted per assumptions, flagged as a future scaling risk.
    - Non-fast-forward push rejections require manual operator reconciliation with no tooling — documented, not mitigated.
    - No subprocess-boot end-to-end coverage exists until a future e2e-tests task ships; this task ships that gap as a documented limitation (the design note), not a closed gap.
    - go-git's behavior under this repo's actual concurrent/rapid commit+push pattern is untested — first real usage, discovered during implementation.
estimated_complexity: high
recommended_executor: claude-code
