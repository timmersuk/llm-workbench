        **Approach:** Single task, single PR. Implement in the same dependency order as before — interface refactor first (so GitStore is written directly against its final shape), then GitStore itself in layers (local commits → clone/resume → push worker), then flip main.go over, then close with a forward-looking design note. All of it lands together for one review.

        **Steps (now commits within one PR, not separate tasks):**
        1. Collapse `TaskStoreFactory`'s per-project-root pattern into a single process-wide singleton; add explicit `projectID` param to `task.Store`/`api.TaskStore`. Refactor `FileStore` onto this new shape; update ~150 existing test call sites.
        2. Build `GitStore` (go-git) satisfying the refactored interface: startup clone/resume logic (clone into empty `WORKSPACE_ROOT`, resume if matching clone, error on ambiguous non-empty state); every Create/Update commits synchronously and locally under a single process-wide mutex. go-git added to `go.mod` with stated reason.
        3. Background push worker: periodic goroutine pushing accumulated local commits to `DATA_REPO_URL`; never pulls after startup; logs and retries indefinitely on failure; non-fast-forward rejections documented as a manual-reconciliation limitation.
        4. Wire into `main.go`: `DATA_REPO_URL` mandatory, fail fast if unset; production path constructs `GitStore`; `FileStore` remains only as a test fixture.
        5. Design note (doc comment near `main.go` or short doc under `docs/`) specifying the subprocess-boot provisioning pattern (`git init --bare` temp remote + exported `DATA_REPO_URL`) that the future `e2e-tests` task's harness must follow — explicitly not verified by this task.

        **Risks:**
        - This is now a genuinely large single PR (mechanical ~150-site refactor + new storage engine + concurrency-sensitive push worker + main.go wiring) — one review has to cover all of it at once, with no intermediate merged checkpoint.
        - Single process-wide write mutex serializes all commits across all projects — accepted per assumptions, flagged as a future scaling risk.
        - Non-fast-forward push rejections require manual operator reconciliation with no tooling — documented, not mitigated.
        - No subprocess-boot end-to-end coverage exists until the future `e2e-tests` task ships; this task ships that gap as a documented limitation (the design note), not closes it.
        - go-git's behavior under this repo's actual concurrent/rapid commit+push pattern is untested — first real usage, discovered during implementation.

        **estimated_complexity:** high

        **recommended_executor:** claude-code

        Does this consolidated single-task/single-PR version look right to finalize, or is there anything in the step sequencing or risk list you want changed before I propose it?
