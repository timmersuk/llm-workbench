      content: |-
        Good — that's noted. I'll fold that in: the e2e-harness success criterion becomes a documentation deliverable in this task (a design note describing the provisioning pattern), not a test this task writes or verifies.

        With that resolved, here's my draft PR sequence based on the locked assumptions in `task.yaml`:

        **Approach:** Land the mechanical interface refactor first (so GitStore can be written directly against its final shape), then build GitStore in isolated layers (store/commit → clone/resume → push worker), then flip main.go over, then close with docs.

        **Steps (PR-sized):**
        1. **Interface + singleton refactor (no GitStore yet):** collapse `TaskStoreFactory`'s per-project-root pattern into a single process-wide singleton; add an explicit `projectID` param to `task.Store`/`api.TaskStore`. Refactor `FileStore` onto this new shape and update the ~150 existing test call sites. Production wiring still uses `FileStore` after this PR — purely a signature/shape change.
        2. **GitStore core (local commits only):** new `GitStore` using go-git, satisfying the refactored interface. Startup clone/resume logic (clone into empty `WORKSPACE_ROOT`, resume if matching clone, error on ambiguous non-empty state). Every Create/Update commits synchronously and locally, guarded by a single process-wide mutex. No push yet. go-git added to `go.mod` with a stated reason (avoid hard git-binary runtime dependency).
        3. **Background push worker:** periodic goroutine pushing accumulated local commits to `DATA_REPO_URL`; never pulls after startup; logs and retries indefinitely on failure; non-fast-forward rejections documented as a manual-reconciliation limitation, not auto-resolved.
        4. **Wire into main.go:** `DATA_REPO_URL` becomes mandatory — fail fast at startup if unset. Production path now constructs `GitStore`; `FileStore` remains only as a test fixture, unreachable in prod.
        5. **Design note (no code):** short forward-looking doc (near `main.go` or in `docs/`) specifying the subprocess-boot provisioning pattern (`git init --bare` temp remote + exported `DATA_REPO_URL`) that the future `e2e-tests` task's harness must follow. Explicitly not verified by this task.

        **Risks:**
        - The ~150-call-site interface refactor (PR1) is a large mechanical diff landing before any GitStore behavior exists — isolating it first de-risks PR2 but means PR1 alone has no new functional value if it stalls.
        - Single process-wide write mutex serializes all commits across all projects — accepted per assumptions, but worth flagging as a future scaling risk.
        - Non-fast-forward push rejections require manual operator reconciliation with no tooling — a real operational gap, only documented, not mitigated.
        - No real subprocess-boot verification exists anywhere yet (main.go's fail-fast/clone-resume/push has zero end-to-end coverage until `e2e-tests` ships) — this task ships that gap as a documented limitation rather than closing it.
        - go-git's API/behavior under concurrent/rapid commit+push cycles is untested against this repo's actual write patterns — first real usage.

        **estimated_complexity:** high

        **recommended_executor:** claude-code (mirrors `e2e-tests`, similarly large mechanical + concurrency-sensitive work)

        Does this sequencing look right, or would you split/reorder/merge any of these five PRs differently?
