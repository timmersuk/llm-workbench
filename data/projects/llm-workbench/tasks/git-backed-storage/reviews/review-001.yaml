decision: approved
notes: |-
    GitStore/FileStore singleton + projectID-param refactor implementing git-backed task/project storage via go-git.

    Automated checks: full test suite passes fresh, `go vet` clean, build clean.

    Standards + spec pass: implementation matches task assumptions — synchronous local commit on every Create/Update guarded by a process-wide mutex, background push worker that retries indefinitely without pulling, startup clone/resume/ambiguous-state logic, DATA_REPO_URL mandatory in main.go (fails fast if unset), FileStore demoted to test-fixture-only and refactored onto the same singleton + projectID-param interface shape (~150 call sites) for consistency. No new runtime dependency beyond go-git, which was pre-approved in the task assumptions.

    Test-meaningfulness: reviewed internal/gitstore/gitstore_test.go and push_test.go. Open() tests assert real outcomes (.git dir exists, ErrAmbiguousWorkspace specifically, project list survives reopen). Commit tests assert actual commit messages/counts via real repo.Log() walks, including a real negative-path assertion (failed Update produces zero new commits). Push worker test asserts a real ref exists on the bare remote after ticking. One cosmetic nit: TestRunPushWorker_StopsOnContextCancelWithNothingToPush ends with a no-op `assert.True(t, true)` marker line — not a defect, the real assertion is the preceding select/timeout.

    Verification steps: all agent-executable startup/runtime paths were driven live via real subprocess launches — missing DATA_REPO_URL (fatal), fresh clone, resume, both ambiguous-state variants, commit-then-push-to-bare-remote, graceful shutdown drain. All confirmed working as specified.

    Known gap (discussed with human, accepted as out of scope for this exec): the success criterion "e2e harness provisions its own bare-repo remote... before launching the real binary subprocess" has no real subprocess-launching e2e harness to update anywhere in this codebase — the task brief's assumptions describe one in the present tense as if it already existed, which appears to be a false premise. The exec instead hardened cmd/server/main_test.go's in-process run() test with the same git-init-bare-remote pattern used by internal/gitstore's own tests, and documented the gap explicitly in a code comment rather than silently substituting it. Human agreed this is a pre-existing infrastructure gap outside this task's control, not a defect introduced by this exec — flagged here for a future task to build the real subprocess e2e harness.

    Human confirmed agreement with the approved recommendation.
