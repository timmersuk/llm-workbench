id: execution-worktree-cleanup
title: Remove execution git worktrees once a task reaches merged

project: llm-workbench

stage: requirements

created_at: 2026-07-25T00:00:00Z
updated_at: 2026-07-25T00:00:00Z

objective: >-
  ResolveExecutionWorkspace (internal/agentrunner/worktree.go) creates a
  fresh git worktree per execution attempt and, by its own doc comment,
  never cleans one up: "The worktree is left in place on return regardless
  of what happens afterward — no automatic cleanup." Nothing anywhere in
  the codebase ever calls `git worktree remove` or deletes a
  .worktrees/<repo>/... directory, including handleMarkPRMerged
  (internal/api/pr.go), the point where a task reaches its terminal
  "merged" stage and its worktree(s) stop being useful. This was found
  while diagnosing a worktree-path collision on the graceful-shutdown
  task: a leftover .worktrees/llm-workbench/exec-001 directory from the
  already-merged nav-url-page-state task was still on disk and collided
  with a new task's own exec-001. Scoping worktree paths by taskID (already
  fixed) prevents that specific collision, but doesn't address the
  underlying leak — worktrees still accumulate forever, consuming disk
  indefinitely over a project's life. Add cleanup so a task's execution
  worktree(s) are removed once the task reaches merged.

constraints:
  - >-
    Use `git worktree remove` (not raw directory deletion) so git's own
    metadata (.git/worktrees/<id>) stays consistent — a bare rm -rf leaves
    orphaned worktree admin state that later confuses `git worktree
    list`/`add` on the shared checkout.
  - >-
    A task can have multiple execution attempts (needs_changes retries,
    docs/adr/0012), each with its own worktree path under
    .worktrees/<repo>/<taskID>/<executionID> — cleanup must remove all of a
    task's execution worktrees, not just the one tied to the latest/merged
    attempt.
  - >-
    Decide during requirements how to handle a worktree with uncommitted or
    unpushed changes at cleanup time (force-remove vs. refuse-and-warn) —
    should not silently discard state that turns out to matter.
  - >-
    Cleanup must be best-effort and must not fail or block the
    MarkPRMerged HTTP response — mirrors the existing pattern in
    CollectExecutionOutput/CollectExecutionPatch (internal/agentrunner/worktree.go),
    where git-inspection failures are logged rather than propagated as
    request failures.
  - Follow docs/engineering conventions.md for implementation choices.

assumptions:
  - >-
    StageMerged is the only terminal stage today (internal/task/task.go) —
    there is no "abandoned"/"archived" stage, so this task's cleanup
    trigger only needs to cover handleMarkPRMerged (internal/api/pr.go).
  - >-
    Sweeping up worktrees already leftover from tasks merged before this
    ships is in scope for a decision (one-time sweep vs. documented manual
    cleanup), but not a hard requirement — requirements stage should
    decide.

success_criteria:
  - >-
    Marking a task's PR as merged (handleMarkPRMerged) removes all of that
    task's execution worktrees under .worktrees/<repo>/<taskID>/ via `git
    worktree remove`.
  - Cleanup failure is logged but never fails the merge-confirmation request.
  - >-
    The disposition of worktrees already orphaned by tasks merged before
    this ships is explicitly decided (swept up, or documented as a manual
    step) rather than silently left ambiguous.

references:
  knowledge:
    - docs/engineering conventions.md
  repo:
    - internal/agentrunner/worktree.go
    - internal/api/pr.go
    - internal/task/lifecycle.go
