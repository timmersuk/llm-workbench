id: multi-platform-local-llm-support
title: Support local LLM platforms other than LM Studio
project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-11T00:00:00Z
updated_at: 2026-07-11T00:00:00Z

objective: >-
  modelprobe's fleet mode and (by extension) the toolloop engine's
  local-model qualification path are currently LM Studio-specific: fleet.go
  drives LM Studio's native /api/v1 management endpoints (list/load/unload)
  directly, and the ordinary probe/loop path assumes LM Studio's
  OpenAI-compatible /v1/chat/completions surface, which normalizes each
  model's native tool-call syntax into the OpenAI tool_calls schema
  server-side (see docs/knowledge or memory note
  modelprobe-lm-studio-format-normalization for why this matters). Other
  local inference platforms — e.g. Ollama, llama.cpp's own server, vLLM,
  text-generation-webui — expose different (or no) model-management APIs,
  and are not guaranteed to normalize tool calls into OpenAI's schema the
  way LM Studio does. This task scopes what "supporting" another platform
  means: at minimum, probing/qualifying models served by it; possibly also
  fleet-style load/unload sweeps if the platform exposes an equivalent
  management API.

constraints:
  - "Must not regress LM Studio support or change its default behaviour — LM Studio remains the primary/first-class target."
  - "No new runtime dependency without a stated reason (project architectural invariant)."
  - "If a platform does not normalize tool calls to the OpenAI schema server-side, that is grounds for a client-side format adapter — do not build speculative multi-format tool-call classification ahead of a concrete non-normalizing target (see memory note modelprobe-lm-studio-format-normalization)."

assumptions:
  - "Not yet decided which platform(s) to target first — Ollama is the most likely candidate given its popularity, but this is unconfirmed."
  - "Fleet-mode load/unload orchestration (fleet.go) is LM-Studio-native-API-specific by design; supporting another platform's equivalent (if any) is a separate concern from basic single-model probing, which already works against any OpenAI-compatible base-url."
  - "The single-model (non-fleet) modelprobe path may already work unmodified against other platforms that expose an OpenAI-compatible /v1/chat/completions endpoint — this should be verified before assuming new code is needed."

success_criteria:
  - "A documented decision on which additional platform(s), if any, are in scope, and what 'support' means for each (probing only vs. full fleet sweep)."
  - "If new code is required, it does not require LM Studio to be installed or running for the codebase to build/test."

