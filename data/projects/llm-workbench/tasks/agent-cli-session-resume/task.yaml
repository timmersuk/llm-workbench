id: agent-cli-session-resume
title: Use claude/codex's native session resume instead of replaying history into the system prompt
project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-24T00:00:00Z
updated_at: 2026-07-24T00:00:00Z

objective: >-
  ClaudeRunner and CodexRunner both currently "resume" a conversation whose
  in-memory client was lost (a server restart, or — for CodexRunner, which
  never caches a client at all — every single turn) by re-rendering the
  entire prior conversation as text and stuffing it into the CLI's
  system/developer-prompt argument (systemPromptWithHistory,
  internal/agentrunner/claude_runner.go, feeding both
  claudecode.WithSystemPrompt and codex's -c developer_instructions=...).
  That argument is literal argv text with an OS command-line length limit
  (~32K chars total on Windows; this already crashed a real Review
  conversation with "the filename or extension is too long" once history
  plus the review system prompt got large enough — fixed short-term by
  capping the replayed history to 8KB and dropping the inlined execution
  diff from the review prompt). Both underlying CLIs have a real,
  already-verified alternative that avoids re-transmitting history at all:
  claude-agent-sdk-go's claudecode.WithResume(sessionID) (the session's own
  on-disk transcript, reloaded CLI-side) and codex-agent-sdk-go's
  client.ResumeThread(ctx, threadID, opts) (a thread/resume JSON-RPC call
  against the persistent app-server, not a CLI argument at all). This task
  is to investigate and, if it holds up, implement switching both runners
  to real session/thread resume as the primary path, keeping
  systemPromptWithHistory only as a fallback for when resume is
  unavailable — which should also make idle-turn reconnects cheaper and
  more likely to hit Anthropic's prompt caching, since a real resume
  replays the exact original transcript rather than a freshly re-rendered
  "## Prior conversation" block that differs from what the model actually
  saw the first time.

constraints:
  - "Do not delete systemPromptWithHistory/its history-replay path — it must remain as the fallback for when a session/thread ID is missing, expired, or resume otherwise fails (e.g. the CLI's session storage was cleared, or the machine changed), so a lost session degrades to today's behavior rather than hard-failing."
  - "The session/thread ID must be persisted somewhere that survives an API process restart — ClaudeRunner.clients/CodexRunner's per-call reconnect are both in-memory-only, and a restart is exactly the trigger case this task exists to handle, so the ID needs a durable home (e.g. conversation-{stage}.yaml or execution metadata), not just a runtime map."
  - "CodexRunner has no session concept today at all (by design — see its type doc comment: 'every Run/Execute call connects a fresh client and closes it when done'); adopting resume there is a bigger structural change than for ClaudeRunner (which already caches a client per SessionKey) and should be scoped/estimated separately within this task rather than assumed to be symmetric effort."
  - "Verify the prompt-caching claim empirically (e.g. via ResultMessage.TotalCostUSD/Usage before vs. after switching to resume) rather than assuming it from the mechanism alone — if it doesn't measurably help, the task's justification narrows to just 'avoids the argv ceiling and re-render cost', which may still be worth doing but changes the priority."

assumptions:
  - "claudecode.WithResume(sessionID) and client.ResumeThread(ctx, threadID, opts) both work as documented in each SDK's own example/reference (verified against github.com/severity1/claude-agent-sdk-go@v0.6.22's docs/reference.md and github.com/hishamkaram/codex-agent-sdk-go@v0.5.1's examples/resume/main.go respectively) — neither has been exercised live against this codebase's actual ClaudeRunner/CodexRunner yet."
  - "Related but distinct from resumable-chat-streams (surviving a browser refresh mid-SSE-response to the human) — this task is about the backend-to-CLI-subprocess session, not the frontend-to-backend HTTP stream; the two could compound (a resumed CLI session behind a resumed browser stream) but neither depends on the other."

success_criteria:
  - "A decision is recorded on whether real session/thread resume is adopted for ClaudeRunner, CodexRunner, both, or neither (with reasons if a runner is deliberately left on history-replay)."
  - "If adopted: the relevant session/thread ID survives an API process restart, resume is attempted first, and systemPromptWithHistory's replay path only fires when resume fails or no ID is on record — verified live, not just by unit test, that a conversation reconnecting after a restart no longer needs to replay its full history as prompt text."
  - "The prompt-caching hypothesis is confirmed or refuted with real usage data from a resumed session, and that finding is recorded regardless of which way it points."

