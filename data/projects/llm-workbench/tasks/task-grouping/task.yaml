id: task-grouping
title: Add a grouping concept for related tasks within a project

project: llm-workbench

stage: requirements

created_at: 2026-07-24T00:00:00Z
updated_at: 2026-07-24T00:00:00Z

objective: >-
  Give a project a way to group related tasks (e.g. a feature broken into
  several tasks) with an explicit ordering/dependency relationship between
  them, so both humans and executors can tell which tasks belong together
  and in what order they're meant to land. Neither `internal/task.Task` nor
  `internal/project.Project` has any such concept today — a task belongs to
  exactly one project and nothing finer-grained (docs/task schema v0.md §6),
  and there is no cross-task ordering or dependency field anywhere in the
  schema.

constraints:
  - >-
    Naming collision to resolve during requirements: this repo already uses
    "milestone" for its own build-plan documents (docs/milestones/*.md,
    numbered PRs within each) — a domain-model grouping object called
    "milestone" would be a second, unrelated meaning of the same word inside
    this very codebase. Consider "epic", "workstream", "initiative", or
    another name during GrillMe rather than defaulting to "milestone".
  - A task belongs to exactly one project permanently (docs/task schema v0.md §6); this grouping concept must nest inside that constraint, not create a second way for a task to change ownership.
  - Follow docs/engineering conventions.md for implementation choices.
  - "No new runtime dependency without a stated reason (see architectural invariants: prefer open standards)."

assumptions:
  - A task's group membership is optional — most existing tasks have no group today, and this must not force retroactive migration or a required field on every existing task.yaml.
  - Ordering/dependency between tasks in a group is declarative data (e.g. a list of prerequisite task ids), not a scheduler — nothing in this task proposes automatically blocking a dependent task's stage transitions; that policy question is separate and can be deferred.
  - Scope is a single project's own tasks; cross-project grouping is out of scope unless requirements surfaces a real need for it.

success_criteria:
  - A concrete name and schema exist for the grouping object (id, title, member task ids, optional ordering/dependency between members) and where it's stored (e.g. a new file under the project directory, or a field added to task.yaml/project.yaml).
  - "The relationship to project scoping (docs/task schema v0.md §6) is explicitly preserved: grouping a task never changes which project owns it."
  - A decision is recorded on whether dependency ordering is purely advisory (surfaced to humans/executors) or enforced anywhere in the workflow engine.

references:
  knowledge:
    - docs/task schema v0.md
    - docs/engineering conventions.md
  repo:
    - docs/milestones/milestone-orphans.md
