summary: >-
  This repo has no CI and no Docker packaging at all. TASK-0003 flagged CI
  as a blocking prerequisite it doesn't want to own itself, and left open
  whether GitHub Actions is the right target and whether it should be its
  own task. This task answers both — yes and yes — and expands scope to
  cover Docker packaging too, since the sibling repo used as a template
  (logthing) ties its full CI workflow to having a Dockerfile in the first
  place.

background: >-
  Surfaced 2026-07-05 while auditing CI status across the repo: no
  .github/ directory exists anywhere, and none of docs/milestones/
  milestone{1-5}.md mention CI — it's a prose scope list per milestone, not
  a task registry, so CI was never scoped into any milestone plan.
  TASK-0003's context.yaml independently flagged the same gap ("no CI
  pipeline in this repo at all") as a prerequisite for its e2e work. The
  user pointed at D:\projects\logthing (same author, same Go+Vite+pnpm
  single-binary architecture — its Makefile target names build-go-local/
  frontend already match this repo's 1:1) as the concrete template: copy
  its Dockerfile and .github/workflows/ci.yml as closely as possible. Since
  logthing's ci.yml only makes full sense once a Dockerfile exists (its
  second job builds and publishes an image), this task bundles Dockerfile
  creation in rather than splitting it into a CI-only task.

files:
  - path: Dockerfile (new)
    role: >-
      port logthing's Dockerfile — debian:bookworm-slim base, non-root
      user, COPY --chown of a prebuilt bin/${TARGETPLATFORM}/workbench,
      ENV defaults, EXPOSE, ENTRYPOINT — minus the syslogsend companion
      binary logthing also copies in
  - path: .github/workflows/ci.yml (new)
    role: >-
      port logthing's ci.yml — a test job (build frontend + go test) and a
      docker job (QEMU/buildx, metadata, conditional login+push, multi-arch
      build) gated the same way logthing gates its release pushes
  - path: Makefile
    role: >-
      needs a multi-arch build target analogous to logthing's
      build-go-local (loops OSES x ARCHES) — the current build-go-local
      only builds for the host GOOS/GOARCH, which isn't enough for the
      Dockerfile's ${TARGETPLATFORM} COPY to work across architectures
  - path: docs/engineering conventions.md
    role: >-
      (future, at implementation time) record the "copy CI/Docker pattern
      from sibling repos" convention so it doesn't need re-deriving next
      time

detail: |
  logthing's Dockerfile (D:\projects\logthing\Dockerfile) copies two
  prebuilt binaries (logthing, syslogsend) from bin/${TARGETPLATFORM}/...
  into a debian:bookworm-slim image running as a non-root user, with
  ENV-configured addrs and a /data volume declared via VOLUME ["/data"].
  llm-workbench only has one binary (workbench, cmd/server) and no syslog
  component, so the port is a straightforward simplification: one COPY, one
  ENTRYPOINT, no syslogsend, no syslog ports.

  WORKSPACE_ROOT (this repo's task/project YAML data root — see
  internal/task/store.go, internal/project/store.go, and
  docs/engineering conventions.md's Storage & file layout section) is the
  analogue of logthing's /data volume/DATA_DIR. logthing's Dockerfile
  models this with VOLUME ["/data"] plus `docker run -v $(DATA_DIR):/data`
  in its Makefile's docker-run target — llm-workbench's Dockerfile will
  need the same shape so task/project data isn't lost when the container
  is recreated. Not designed yet; flagged as an open question below.

  logthing's .github/workflows/ci.yml
  (D:\projects\logthing\.github\workflows\ci.yml) has:
    - a `test` job: actions/checkout, actions/setup-go, actions/setup-node,
      corepack enable + pnpm install/build frontend, go test ./... — a
      near-verbatim port, since llm-workbench's Makefile already uses the
      same frontend/build-go-local target names as logthing's.
    - a `docker` job (needs: test): derives a CI_BUILD_ID (git short sha,
      "-dirty" suffix if the worktree is dirty, or the tag name on a tag
      push), sets up QEMU + buildx, runs docker/metadata-action for tag
      shapes (branch/pr/semver/latest), conditionally logs in and pushes
      via docker/login-action gated on a release event / tag push / manual
      workflow_dispatch input, then docker/build-push-action targeting
      linux/amd64 + linux/arm64 with GHA layer caching. This whole job is
      new territory for llm-workbench — nothing like it exists yet — which
      is why this task bundles Dockerfile + full CI rather than a
      test-job-only CI task.

  logthing's Makefile's build-go-local cross-compiles for every OS x ARCH
  combo in OSES/ARCHES before the Dockerfile can COPY
  bin/${TARGETPLATFORM}/<bin>; llm-workbench's current build-go-local only
  builds for the host's GOOS/GOARCH (Makefile:14-19), so that target needs
  the same loop added before the docker job's multi-arch build can work.

verification:
  - "docker build . succeeds locally and docker run serves the dashboard/API on the configured port."
  - "CI's test job passes on a PR."
  - "CI's docker job builds a multi-arch image on a tag push (dry run without actually pushing, until the registry/credentials question below is resolved)."
  - "make test / make all still pass locally, unaffected by the Dockerfile/CI additions."

open_questions:
  - "Which registry — Docker Hub (matching logthing's docker/login-action + secrets.DOCKERHUB_USERNAME/TOKEN) or GHCR? Not yet decided; Docker Hub requires provisioning secrets for this repo specifically."
  - "Does llm-workbench need a persistent-volume/compose story analogous to logthing's docker-compose.yml + DATA_DIR, given WORKSPACE_ROOT holds task/project data that shouldn't be lost on container recreation?"
  - "Does logthing's git-tag-based release/versioning scheme (release-patch Makefile target, semver tags) apply here, or is that premature before milestone 1 itself is done?"
