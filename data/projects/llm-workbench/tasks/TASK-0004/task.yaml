id: TASK-0004
title: Add Dockerfile and GitHub Actions CI
project: llm-workbench

status: draft

stage: planning

created_at: 2026-07-05T00:00:00Z
updated_at: 2026-07-05T00:00:00Z

objective: >-
  Add Docker packaging for the workbench binary and a two-job GitHub Actions
  CI workflow — build+test on every push and pull request, plus a Docker
  build/publish job on release/tag — porting the sibling repo logthing's
  Dockerfile and .github/workflows/ci.yml as the starting point (same
  Go+Vite+pnpm single-binary architecture, same bin/<os>/<arch>/<name> build
  layout).

constraints:
  - "Copy logthing's Dockerfile and ci.yml as closely as possible; only diverge where this repo's build genuinely differs."
  - "Single workbench binary (cmd/server) — no syslogsend-style companion binary to carry over."
  - "Dockerfile copies a prebuilt bin/${TARGETPLATFORM}/workbench (multi-arch via Makefile cross-compilation), not a multi-stage in-image Go build — matches logthing's pattern."

assumptions:
  - GitHub Actions is the correct CI target — resolves the open question left in TASK-0003's context.yaml.
  - A container registry (Docker Hub, matching logthing, or GHCR) will be used for the docker job's publish step — not yet decided.

success_criteria:
  - Dockerfile builds a working image that runs the workbench binary.
  - .github/workflows/ci.yml's test job builds the frontend and runs go test ./... on every push/PR.
  - .github/workflows/ci.yml's docker job builds a multi-arch image, mirroring logthing's job shape.
  - TASK-0003's CI prerequisite is satisfied instead of being an open question.

references:
  knowledge:
    - docs/engineering conventions.md
  repo: []
