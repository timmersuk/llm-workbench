 it (tray remains for background/service mode, native window is an optional richer client)?"],"summary":"Explore replacing the browser tab with an actual native window (e.g. Wails) around the existing embedded UI, as a fuller desktop-app experience beyond windows-systray-icon''s tray affordance. Deliberately scoped as exploration-only for now, not a committed build.","verification":[{"description":"N/A at this stage — this task''s own success criterion is a documented decision, not a working feature.","kind":"human_judgment"}]},"objective":"Explore replacing the browser tab with an actual native window (e.g. Wails) around the existing embedded UI (internal/web, served by api.NewRouter) — the fuller desktop-app experience beyond the systray icon in windows-systray-icon. Deliberately deferred and lower priority: the server binary is already a single self-contained executable with the UI embedded via go:embed and no CGO, so this is additive packaging on top of an already-working foundation, not a blocker for the background service or systray work. Needs its own exploration/plan pass when picked up — not detailed here.","success_criteria":["A decision is documented on whether a native window is worth building given the systray icon already covers \"no manual browser tab\" for most use cases, and if so, a follow-up plan exists for it."]}'
