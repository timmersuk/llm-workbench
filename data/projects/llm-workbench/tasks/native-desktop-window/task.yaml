id: native-desktop-window
title: Explore wrapping the embedded UI in a native desktop window
project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-07T00:00:00Z
updated_at: 2026-07-07T00:00:00Z

objective: >-
  Explore replacing the browser tab with an actual native window (e.g.
  Wails) around the existing embedded UI (internal/web, served by
  api.NewRouter) — the fuller desktop-app experience beyond the systray
  icon in windows-systray-icon. Deliberately deferred and lower priority:
  the server binary is already a single self-contained executable with the
  UI embedded via go:embed and no CGO, so this is additive packaging on top
  of an already-working foundation, not a blocker for the background
  service or systray work. Needs its own exploration/plan pass when picked
  up — not detailed here.

constraints:
  - "Not blocking graceful-shutdown, windows-background-service, or windows-systray-icon — those should ship independently of this task."

assumptions:
  - A native window would likely reuse the same api.NewRouter handler and embedded frontend, either via an in-process webview pointed at a locally-bound port or a library-level embed, rather than requiring a UI rewrite.

success_criteria:
  - A decision is documented on whether a native window is worth building given the systray icon already covers "no manual browser tab" for most use cases, and if so, a follow-up plan exists for it.

references:
  knowledge:
    - docs/engineering conventions.md
  repo:
    - internal/web/assets.go
    - internal/api/router.go
