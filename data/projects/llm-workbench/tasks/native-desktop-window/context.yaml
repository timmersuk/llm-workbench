summary: Explore replacing the browser tab with an actual native window (e.g. Wails) around the existing embedded UI, as a fuller desktop-app experience beyond windows-systray-icon's tray affordance. Deliberately scoped as exploration-only for now, not a committed build.
background: 'Surfaced 2026-07-07 during the same architectural-pivot assessment as the other three tasks in this group, then explicitly deferred: the systray icon already solves "no manual browser tab" for most practical purposes, so a full native window is lower-value, later work rather than part of the initial background-service pivot. ADR-0014 (docs/adr/0014-defer-native-go-frontend-in-favor-of-react-spa.md) already did a first pass surveying Fyne, gioui, Wails, and lxn/walk, ruling Wails in as the fallback specifically if E2E-test rigor (Vitest/Playwright) matters more than a "genuinely native" UI — but it didn''t evaluate Wails against this task''s exact reuse-of-api.NewRouter, in-process-server-plus-webview shape.'
files:
    - internal/web/assets.go
