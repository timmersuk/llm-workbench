    - docs/adr/0014-defer-native-go-frontend-in-favor-of-react-spa.md
detail: |-
    The server binary is already a single self-contained executable — UI embedded via go:embed, no CGO, no OS-specific code anywhere in the tree — so a native-window wrapper is additive packaging on top of an already-working foundation, not a prerequisite for or blocker of graceful-shutdown, windows-background-service, or windows-systray-icon. Those three should ship independently of whatever this task eventually decides.

    This task is gated on windows-systray-icon shipping and being used in daily practice first: the whole point of this exploration is to judge whether the tray already solved the "no manual browser tab" problem well enough, so starting it before that real-world signal exists would mean answering the question blind.

    Working hypothesis (not yet validated): the tray remains the affordance for background/service mode, and a native window would be an optional richer client layered on top for active use — not a replacement for the tray. Also not designed in any depth yet: no assessment of packaging/signing overhead per OS. ADR-0014 gives a head start on the library survey but was written for the frontend-architecture decision generally, not this task's specific in-process-webview shape.
verification:
