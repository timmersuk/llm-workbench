id: mcp-lsp-bridge-tool
title: Add an MCP-sourced LSP-bridge navigation tool to the tool-loop engine
project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-12T00:00:00Z
updated_at: 2026-07-12T00:00:00Z

objective: >-
  Milestone 8 built Read/Grep/Glob/Write/Edit/Bash as native Go tools in
  internal/toolloop, and deliberately deferred MCP tool-sourcing as a
  fast-follow (see docs/milestones/milestone8.md, "Open questions — resolved":
  MCP tool-sourcing → fast-follow, not initial). This task adds the one
  MCP-sourced tool that pays for itself: an LSP-bridge server (e.g.
  isaacphi/mcp-language-server) exposing semantic navigation
  (definition/references/implementations/hover) so the local-model Execute
  path can navigate code by symbol rather than by grepping text — the same
  token-saving semantic search LSP gives a human agent. The engine's toolset
  is already a parameter (toolloop.Config.Tools), so this slots in without
  restructuring the loop. The MCP *filesystem* server stays out of scope:
  native tools with controlled output caps win on tokens (same doc).

constraints:
  - "The engine stays the integration point: an MCP-sourced tool must satisfy the existing toolloop.Tool interface (Spec/Execute) so Run and Execute consume it identically to the native tools — no second tool-dispatch path."
  - "Output must respect the same explicit-truncation output-cap contract the native tools honour (however the caps are eventually sourced — see tool-output-caps-config), so an oversized navigation result can't flood a small-context local model."
  - "Scope the MCP server to the workspace the run operates in (the shared checkout for Run, the execution worktree for Execute), preserving the per-instantiation workspace confinement the native tools enforce."
  - "No new always-on runtime dependency for callers that don't use it: sourcing the LSP-bridge tool must be opt-in/graceful, so a run with no MCP server configured behaves exactly as today (project architectural invariant: no new dependency without a stated reason)."

assumptions:
  - "Open question: whether to spawn the MCP LSP server per-run or share a long-lived one — trades startup latency against process lifecycle complexity; not yet decided."
  - "Open question: which language servers to bridge first — Go (gopls) is the immediate need for this repo's own dogfooding; others follow the same MCP shape."
  - "The hand-rolled engine is already an MCP-agnostic loop (ADR 0011): consuming an MCP client is a tool-sourcing concern layered above it, not an engine change."

success_criteria:
  - "An Execute (or Run) loop can call at least one LSP-bridge navigation tool (e.g. find-definition or find-references) sourced over MCP, and act on the result, against this repository's Go code."
  - "The tool is offered through toolloop.Config.Tools like any native tool, with no separate dispatch path in the engine."
  - "A run with no MCP LSP server configured is unaffected — same behaviour and dependencies as before this task."
  - "Navigation output honours the tool-output-cap contract (explicit truncation marker when capped)."

