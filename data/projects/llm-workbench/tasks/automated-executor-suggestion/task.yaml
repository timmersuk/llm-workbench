id: automated-executor-suggestion
title: Suggest an executor/model at plan-finalize time from qualification data
project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-14T00:00:00Z
updated_at: 2026-07-14T00:00:00Z

objective: >-
  Two dormant seams already reserve the idea of the system recommending which
  executor/model should run a task, but nothing populates or acts on either:
  plan.yaml's `recommended_executor` field (docs/task schema v0.md) is an
  inert empty string, hand-filled in a couple of plans, and
  docs/project_summary.md's §6 lists "executor selection" as a deterministic
  Workflow Engine responsibility with no code behind it. Separately,
  cmd/modelprobe already produces the raw capability data such a feature would
  consume — offline, human-read fleet sweeps yielding per-model READY /
  NOT-READY qualification verdicts. This task scopes turning that manual,
  out-of-band "which model is good enough" decision into an in-workflow
  *suggestion* surfaced when a plan is finalized (or immediately before an
  Execute is triggered): read the latest qualification verdicts plus the
  plan's `estimated_complexity`, and propose a `recommended_executor` for a
  human to accept or override. Explicitly a suggestion, never an automatic
  override of the human's executor choice — "humans own intent"
  (docs/architectural invariants.md).

  This is deliberately *not* MVP scope. The milestone spine (M1-M8, plus M6
  Review and M7 Merge/Knowledge) is the workflow loop needed to dogfood the
  system on itself; executor selection is orthogonal to whether that loop
  runs, and its payoff only appears at "many projects, many tasks" scale with
  mixed executors and real cost/capability tradeoffs to arbitrate. Parked
  here so the seam is on record without implying it belongs in the MVP set.

constraints:
  - "Suggestion only, never automatic: the recommendation is a default the human sees and can override, not a silent executor switch — per the 'humans own intent' invariant (docs/architectural invariants.md)."
  - "No hidden state: the recommendation and the qualification data it derived from must be inspectable, not an opaque score (docs/architectural invariants.md, project_summary.md §9.1)."
  - "Do not build speculative ranking/routing machinery ahead of a real multi-executor fleet to route across — a suggestion over {claude-code, one known-good local model} is not worth automating; the value is conditional on multi-platform-local-llm-support landing first."
  - "No new runtime dependency without a stated reason (project architectural invariant)."

assumptions:
  - "Dependency: multi-platform-local-llm-support (draft) is a soft prerequisite — auto-suggesting across a model fleet presupposes the fleet is addressable and qualifiable beyond LM Studio. Confirm ordering before building."
  - "Precursor exists: cmd/modelprobe's fleet-mode READY/NOT-READY verdicts are the intended input; this task consumes qualification data rather than re-deriving capability. Whether verdicts are read live or from a persisted artifact is an open question."
  - "Open question: does the suggestion surface at plan finalize (populating plan.yaml's recommended_executor) or at Execute-trigger time (a UI default), or both? The schema field points at the former; the human's actual decision point may be the latter."
  - "Open question: what signal maps a task to a recommended executor — plan.estimated_complexity alone, or also task constraints / project context? Start minimal; do not invent a scoring model before a real use case names what it needs."
  - "Post-MVP: this should not be scheduled until the self-hosting loop (M6 Review + M7 Merge/Knowledge) is closed and actually generating the multi-project pressure that makes routing pay off."

success_criteria:
  - "A documented decision on whether automated executor suggestion is worth building, and if so a scoped plan naming: the surfacing point (plan-finalize vs Execute-trigger), the input signals, and how modelprobe verdicts reach the workflow."
  - "If built, plan.yaml's recommended_executor is populated by inspectable logic (not a hardcoded string), and the human can always override the suggested executor at execution time."
  - "If deferred further or declined, an explicit record of why, so the recommended_executor / 'executor selection' seams stop reading as unclaimed gaps."

