id: resumable-chat-streams
title: Make in-progress chat streams survive a browser refresh
project: llm-workbench

status: draft

stage: requirements

created_at: 2026-07-06T00:00:00Z
updated_at: 2026-07-06T00:00:00Z

objective: >-
  Milestone 3's streaming chat design relays a completion live over a single
  HTTP response per browser tab, decoded and re-emitted by the backend as it
  arrives — nothing about the in-progress generation is held anywhere once
  that response is written. If the tab refreshes, the connection drops, or
  the user navigates away mid-stream, the in-progress response is lost with
  no way to reconnect and resume or even replay what had already streamed.
  Fixing this properly requires at minimum server-side in-memory storage of
  in-progress conversation state (keyed by some id) so a client could
  reconnect and pick up from where it left off — explore whether that's the
  right shape, or whether Milestone 4's "conversation attached to task"
  persistence solves most of this for free once conversations have a
  durable home to write completed/partial turns into as they happen.

constraints:
  - "Not blocking Milestone 3 — the simple, non-resumable streaming implementation there is deliberate, accepted debt, not a defect to fix in passing."
  - "Should not duplicate Milestone 4's task-scoped conversation persistence with a separate bespoke in-memory buffer if that work already gives conversations a durable home — resolve the dependency/ordering between the two before building anything here."

assumptions:
  - The right fix might just be "wait for Milestone 4's task-scoped conversation persistence and get resumability for free," rather than a dedicated in-memory buffer — needs revisiting once that milestone's shape is known.

success_criteria:
  - A decision is documented on whether resumability is solved by Milestone 4's conversation persistence or needs its own dedicated mechanism.
  - If a dedicated mechanism is needed, in-progress streams survive a browser refresh without losing the in-progress response.

