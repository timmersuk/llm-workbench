summary: >-
  Neither the new Go integration tests (internal/api/integration_test.go)
  nor the planned frontend-unit-tests task can catch a bug where the
  built frontend and the live API disagree — e.g. a field the frontend
  expects that the backend renamed, or an SPA route the embedded server's
  fallback doesn't actually serve correctly once real routing/build output
  is involved. This task closes that gap by driving the real, built,
  single-binary artifact through a real browser.

background: >-
  Surfaced in the same testing-stage-gap audit as frontend-unit-tests (2026-07-05).
  Deliberately the last of the three testing gaps to close: it's the most
  expensive (new tooling, browser automation) and depends on infrastructure
  (CI) that doesn't exist yet, whereas the Go integration test and the
  frontend unit tests are both self-contained and land without any new
  process infrastructure.

files:
  - path: .github/workflows/ci.yml (new)
    role: run make test on push/PR — the actual missing prerequisite for this task
  - path: Makefile
    role: add a test-e2e target, separate from test, that builds the binary and runs Playwright
  - path: e2e/ (new, repo-level, not under frontend/)
    role: Playwright test suite and config — lives here because it drives the built Go binary, not the Vite dev server
  - path: internal/chat/client_test.go
    role: precedent for the httptest.NewServer-fake-upstream pattern the LLM stub should reuse, just across a real process boundary instead of in-process
  - path: cmd/server/main.go
    role: reference for WORKSPACE_ROOT / HTTP_ADDR / LLM_BASE_URL env vars the e2e harness needs to set when booting the real binary

detail: |
  Why Playwright lives at the repo root in a new e2e/ directory rather than
  nested in frontend/: it drives the compiled artifact
  (bin/$(GOOS)/$(GOARCH)/workbench per the Makefile), not `pnpm dev` — its
  dependency is the whole repo's build output, not just the frontend
  source tree. Nesting it under frontend/ would misrepresent what it
  actually tests.

  Fixture layout: the e2e harness should boot the real binary with
  WORKSPACE_ROOT pointed at a temp directory laid out exactly like
  data/tasks/ and data/projects/ (see internal/task/store.go and
  internal/project/store.go's <root>/<id>/<kind>.yaml convention) — reusing
  the real on-disk shape rather than a synthetic fixture format, so the
  test also implicitly exercises that the real FileStore reads it
  correctly under a real server process.

  LLM stub: chat.Client speaks the OpenAI-compatible /chat/completions and
  /models shape (docs/engineering conventions.md's "Chat / LLM provider
  integration" section). internal/chat/client_test.go and
  internal/api/integration_test.go already fake this in-process via
  httptest.NewServer; the e2e version needs the same fake server, just
  reachable from the separately-running real server process (set
  LLM_BASE_URL to the fake server's URL before starting the binary,
  instead of wiring it directly into a Go struct).

  Why this needs CI first rather than just running locally: an e2e check
  that only ever runs on a developer's machine doesn't catch regressions
  before they land — the whole point of this test is to be a gate. Since
  there's currently no CI pipeline in this repo at all (verified: no
  .github/workflows, no other CI config), that gap needs to close before
  or alongside this task, not after.

verification:
  - "CI runs make all, boots the binary against seeded fixtures, and Playwright's suite passes against it."
  - "At least one test loads the dashboard and asserts real task/project data (not mocked) renders in a real browser."
  - "The chat panel test exercises a stubbed LLM endpoint end-to-end (UI input -> real HTTP call -> stub response -> UI render), with no dependency on a real model being available."
  - "make test-e2e works locally too, for a developer who wants to run it without pushing to CI."

open_questions:
  - "Is GitHub Actions actually the right CI target, or is there a preference for something else? Assumed as the likely default (GitHub-hosted repo) but not confirmed — worth resolving before starting, since the workflow-file step depends on it."
  - "Should the CI workflow (step 1) be split into its own task if it turns out to be substantial on its own, rather than treated as a sub-step of this one? Flagged as a risk in plan.yaml; revisit once scoped."
