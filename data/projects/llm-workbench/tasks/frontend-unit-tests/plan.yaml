approach: >-
  Added Vitest + React Testing Library as frontend devDependencies with a
  sibling frontend/vitest.config.ts (mergeConfig over vite.config.ts, kept
  separate so the devDependency never touches the production tsc -b/build
  path), colocated *.test.ts(x) next to source, and wired a frontend-test
  Makefile target into the existing test target. Covered the full current
  scope — every api.ts function including the SSE streaming helpers, and
  every component including the GrillMe/Planning-Mode streaming mechanism
  — rather than the original narrower TasksPanel/4-function scope, which
  had gone stale.

steps:
  - "Added vitest, @testing-library/react, @testing-library/jest-dom, @testing-library/user-event, and jsdom as devDependencies; added frontend/vitest.config.ts (jsdom environment, setupFiles) and frontend/src/setupTests.ts (jest-dom matchers, RTL cleanup, vi.clearAllMocks per test)."
  - "Added a test script to frontend/package.json (vitest run)."
  - "De-risked the toolchain via two permanent (not throwaway) spike tests first: listFields.test.ts (pure functions) then TaskKanbanBoard.test.tsx (simplest real component) — confirmed jsdom/RTL/React 19/verbatimModuleSyntax all work together with zero friction."
  - "Wrote frontend/src/api.test.ts covering all 18 exported functions (getJSON/mutateJSON-backed requests thoroughly via 2 representative callers each plus light smoke tests for the rest, getHealthStatus's 3 cases, and a 6-case streaming matrix for streamSSE/streamChatCompletion/postStageMessage using a real Response over a real ReadableStream)."
  - "Wrote render/behavior tests for every component: draft forms, TaskForm, ProjectForm, GrillMePanel (the one deep exercise of the streaming Draft/Finalize/Revise mechanism), PlanningModePanel (light), TaskDetailPanel, ProjectDetailPanel, ProjectsPanel, ChatPanel, App — each mocking the ./api module boundary (and any child component it renders) rather than fetch."
  - "Fixed two real bugs the tests surfaced: StageConversationPanel's shallow Draft-merge dropping nested context fields on a partial tool-call payload, and ProjectForm's unlabeled edit-mode ID input."
  - "Added the frontend-test Makefile target and folded it into test."
  - "Updated the Frontend conventions section of docs/engineering conventions.md with a Testing bullet."
  - "Refreshed this task's own task.yaml/context.yaml/plan.yaml to match the actual scope delivered."

risks:
  - "RESOLVED: Vitest/jsdom/verbatimModuleSyntax/React 19 all worked together with no friction, confirmed by the two spike tests before the full suite was written."
  - "RESOLVED (worth recording): vi.restoreAllMocks() does not reliably clear vi.mock()-based auto-mock call history between tests in the same file — surfaced as inflated toHaveBeenCalledTimes counts; fixed with an explicit beforeEach(vi.clearAllMocks) in setupTests.ts. Any future test file relying on per-test call-count assertions benefits from this already being in place."
  - "corepack enable (frontend-test's own Makefile recipe, mirroring the pre-existing frontend target) fails with EPERM in this dev sandbox due to missing permission to write shims into the Node install directory — a pre-existing environmental limitation of this machine, not something introduced here; verified equivalent via `npx pnpm run test` instead, and presumed fine in CI/environments with normal permissions."

estimated_complexity: medium
recommended_executor: claude-code
