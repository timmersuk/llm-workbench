id: frontend-unit-tests
title: Introduce frontend unit test tooling

project: llm-workbench

status: complete

stage: merged

created_at: 2026-07-05T00:00:00Z
updated_at: 2026-07-06T00:00:00Z

objective: >-
  Introduce a unit-test framework for the frontend (Vitest + React Testing
  Library) and cover the data-fetching layer (api.ts, including the SSE
  streaming helpers) and every component, so frontend logic has the same
  safety net the Go backend already has.

constraints:
  - "Vitest + React Testing Library only (Vite-native, no second test runner)."
  - "api.test.ts mocks fetch directly; every other test mocks the ./api module boundary instead of fetch, so wire-format correctness and rendering/state logic are never asserted twice."
  - "Wire a test script into make test so it runs by default, not as a silent opt-in."
  - "Cover the streaming/SSE-consuming code (streamSSE, streamChatCompletion, postStageMessage, and the two panels that consume them) in this same pass rather than deferring it, since that was the newest and least-covered code at the time this task was picked back up."

assumptions:
  - Node's fetch/Response/ReadableStream/TextEncoder/TextDecoder are available as process-level globals regardless of the configured jsdom test environment, so constructing fake streaming Response objects needs no extra polyfill.

success_criteria:
  - frontend/src/api.ts's 18 exported functions have unit tests covering success and error-status paths, including the streaming SSE matrix (multiple events, split chunks, non-ok, no-body, trailing partial line, non-data lines).
  - Every component has at least one render test; the GrillMe/Planning-Mode Draft-Finalize-Revise streaming mechanism gets one thorough exercise via GrillMePanel.test.tsx rather than being repeated per component.
  - make test runs both the Go and frontend suites and fails the build if either fails.

