id: task-yaml-parse-errors
title: Decide how to handle task/project YAML that fails to parse

project: llm-workbench

stage: requirements

created_at: 2026-07-26T00:00:00Z
updated_at: 2026-07-26T00:00:00Z

objective: >-
  On 2026-07-26, two task.yaml files (task-discovery-tool, task-grouping)
  failed to load — internal/task/store.go's readTask hit a yaml.Unmarshal
  error because a plain-style YAML list item happened to contain a colon
  followed by a space, which YAML parses as an implicit one-pair mapping
  instead of a string. internal/task/store.go's List already isolates this
  per task via LoadError so one bad file doesn't take the rest of the list
  down, but the frontend still surfaces it only as an opaque "N tasks
  failed to load" with no way to act on it short of a human hand-editing
  the YAML. Every task.yaml (and project.yaml, context.yaml, etc.) in this
  workspace is authored by an LLM-driven workflow rather than typed by
  hand, today Claude Code but not guaranteed to stay that one tool or stay
  inside this repo (the data directory is planned to move out of it per a
  separate task) — so this class of failure is expected to recur, possibly
  in shapes other than the one seen so far. Decide what should actually
  happen when task/project YAML doesn't parse: is this addressed in the
  loader itself, in a separate validation/lint step, in how the authoring
  tool is prompted to write YAML, some combination, or something else —
  and how much tolerance for non-standard YAML is appropriate before it
  risks silently masking genuinely bad data.

constraints:
  - Whatever mechanism is chosen must not depend on which tool authored the YAML (Claude Code today, possibly a different model or tool later, possibly hand-authored) or on the data directory living inside this repo.
  - "Per this repo's no-hidden-state invariant: if a task's on-disk YAML is non-standard in a way the system tolerates or repairs, a human must be able to tell — this cannot be a silent, untraceable acceptance."
  - Must not regress the existing behavior where one malformed task/project fails in isolation (LoadError) rather than taking down the whole List call.
  - Follow docs/engineering conventions.md for implementation choices.
  - "No new runtime dependency without a stated reason (see architectural invariants: prefer open standards)."

assumptions:
  - The one failure shape observed so far (a plain scalar containing a colon-space, misparsed as a single-pair mapping) is real and reproducible, but should not be assumed to be the only shape worth handling — the requirements/planning conversation should look at whether other classes of LLM-authored YAML mistakes are worth covering in the same pass.
  - The mechanism (loader-side recovery, a separate validation tool, generation-side prompting, or another approach entirely) is not decided here — that is exactly what this task's requirements/planning stage is for.

success_criteria:
  - A decision is recorded on where in the architecture this problem is addressed, and why, given the constraints above (tool-independence, data directory moving out of this repo).
  - The two real failures from 2026-07-26 (task-discovery-tool/task.yaml, task-grouping/task.yaml, both hand-fixed by quoting) are captured as regression fixtures for whatever mechanism is chosen.
  - Whatever is built, a human can still tell after the fact that a given task/project's YAML needed non-standard handling, per the no-hidden-state invariant.

references:
  knowledge:
    - docs/task schema v0.md
    - docs/engineering conventions.md
  repo:
    - internal/task/store.go
    - internal/project/store.go
    - data/projects/llm-workbench/tasks/task-discovery-tool/task.yaml
    - data/projects/llm-workbench/tasks/task-grouping/task.yaml
