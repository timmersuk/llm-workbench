id: ui-validation-tooling
title: Investigate a Playwright-equivalent tool for agent-driven UI validation

project: llm-workbench

stage: requirements

created_at: 2026-07-24T00:00:00Z
updated_at: 2026-07-24T00:00:00Z

objective: >-
  Investigate adding Playwright (or another suitable tool) so an executor
  working on frontend changes can drive and inspect the running app in a
  real browser during implementation/review, rather than relying on
  reading code or a human manually checking the UI. The target capability
  is equivalent to Claude Code's own embedded-browser tool (navigate,
  click, read page/console/network, screenshot) but usable by whichever
  executor is running a task in this workflow.

constraints:
  - "Distinct from the e2e-tests task: that task is about a CI-run, deterministic Playwright test suite (make test-e2e); this task is about an interactive/ad-hoc validation tool available during a task's implementation or review stage. The two may end up sharing the same Playwright dependency, but should be evaluated as separate concerns rather than assumed identical."
  - "No new runtime dependency without a stated reason, per project architectural invariants (prefer open standards)."
  - Follow docs/engineering conventions.md for implementation choices.

assumptions:
  - The immediate motivation is parity with the ad-hoc browser-driving tools available to Claude Code itself (navigate, click/type, read DOM/console/network, screenshot) — not full cross-browser test coverage.

success_criteria:
  - A clear recommendation exists on whether to adopt Playwright (or an alternative) for agent-driven UI validation, and how it would be invoked (CLI, MCP tool, executor-specific integration).
  - The relationship/overlap with the existing e2e-tests task's Playwright usage is explicitly resolved (shared dependency vs. fully separate concern).
  - If adopted, a concrete integration point is identified (e.g. a make target, a tool available to executors, or a documented manual workflow).

references:
  knowledge:
    - docs/engineering conventions.md
  repo:
    - data/projects/llm-workbench/tasks/e2e-tests/task.yaml
