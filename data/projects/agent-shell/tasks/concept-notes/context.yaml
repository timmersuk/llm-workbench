summary: >-
  A separate, much lighter-weight sibling to llm-workbench: a session
  shell that freely picks between Claude, Codex, or a homespun Go agent
  runner, but deliberately skips llm-workbench's Task/Project/stage/
  workflow-engine automation — closer to a manual, single-session tool
  than a control plane.

background: >-
  Arose from a 2026-07-10 rhetorical question comparing llm-workbench to
  github.com/heyhuynhgiabuu/openpi (an Electron/TypeScript desktop shell
  wrapping a single fixed agent, "Pi" — no multi-agent selection despite
  a model picker). Investigation found llm-workbench already solves the
  hard part of that comparison: a Go-native, narrow `AgentRunner`
  interface (internal/agentrunner/runner.go) with three live
  implementations (ClaudeRunner, CodexRunner, ChatClientRunner/"local"),
  selected per-request via an `Executor` field and filtered to only
  live-healthy options by internal/api/agent_executors.go. That
  multi-executor core is reusable, proven infrastructure — not something
  a leaner tool would need to redo.

  What llm-workbench deliberately is NOT, though, is minimal: it's a full
  workflow control plane (Task/Project/Knowledge domain objects, an
  explicit Requirements->Architecture->Planning->Implementation->Review->
  Completion stage machine, review workflows, a knowledge base). That's
  the right shape for llm-workbench's actual goal (structured, versioned,
  inspectable work coordination) but it's overhead for someone who just
  wants to open a session, pick an agent, and work — no stages, no
  review gate, no durable task bookkeeping. That gap is the seed of this
  concept: same proven multi-agent core, deliberately less automation
  wrapped around it.

