detail: |
  Not designed. Recorded so the idea isn't lost, and so a future session
  doesn't have to re-derive that llm-workbench's executor abstraction
  already generalizes cleanly to this use case.

  Open threads to resolve if this is ever picked up:
  - Reuse internal/agentrunner directly (extract as a module, or vendor
    the pattern) vs. write a fresh, smaller implementation inspired by it.
  - What shell fits a "less automated" tool best — CLI, TUI, or a minimal
    single-page UI — given llm-workbench itself is a web frontend over a
    stage-oriented API.
  - What "less automated" concretely means: no stages at all? No task
    persistence? Keep Projects (context/constraints/knowledge scoping)
    but drop everything downstream of picking an agent and sending a
    message?

verification: []

open_questions:
  - Is this worth building at all, or is it fully served by using
    llm-workbench's `local`/`claude-code`/`codex` executors directly
    without the surrounding workflow (e.g. via its chat API)?
  - Should this live as a new standalone repo, or as a thin alternate
    frontend/binary inside llm-workbench that reuses internal/agentrunner?
